name: Airlinerra Licence 2 foreign-network design (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'website/licensing-planner.mjs'
      - 'website/game-permission-applications-client.mjs'
      - 'website/game-permission-applications-view.mjs'
      - 'server/section9-permission-player-http.mjs'
      - 'server/licence2-independent-review-commit-service.mjs'
      - 'server/licence2-game-review-processor.mjs'
      - 'tests/test_licence2_independent_review_commit_service.mjs'
      - 'tests/test_licence2_game_review_processor.mjs'
      - 'tests/test_section9_permission_player_api_ui.mjs'
      - 'tests/test_licensing_planner.mjs'
      - 'tests/test_licence2_foreign_network_foundation.mjs'
      - 'tests/test_licence2_fifth_consolidation.mjs'
      - 'supabase/migrations/*merge_fifth_freedom_into_licence2.sql'
      - 'supabase/migrations/*retire_standalone_licence6_structures.sql'
      - 'supabase/migrations/*l2_home_connected_route_no_extra_base.sql'
      - 'supabase/migrations/*licence2*.sql'
      - 'docs/AIRLINERRA_LICENCE2_*'
      - '.github/workflows/airlinerra-licence2-four-level-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licence2-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify correct read-only foreign-network licence planner
        run: |
          node --check website/licensing-planner.mjs
          node --check server/section9-permission-player-http.mjs
          node --check server/licence2-independent-review-commit-service.mjs
          node --check server/licence2-game-review-processor.mjs
          node --check tests/test_licence2_game_review_processor.mjs
          node --check tests/test_licence2_independent_review_commit_service.mjs
          node --check website/game-permission-applications-client.mjs
          node --check website/game-permission-applications-view.mjs
          node --check tests/test_licensing_planner.mjs
          node --check tests/test_licence2_fifth_consolidation.mjs
          node --test tests/test_licence2_fifth_consolidation.mjs tests/test_licensing_planner.mjs tests/test_licence2_foreign_network_foundation.mjs tests/test_section9_permission_player_api_ui.mjs tests/test_licence2_independent_review_commit_service.mjs tests/test_licence2_game_review_processor.mjs
      - name: Validate website build
        run: |
          cd website
          npm run build
