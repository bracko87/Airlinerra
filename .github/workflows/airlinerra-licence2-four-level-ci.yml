name: Airlinerra Licence 2 four-level proposal (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'website/licensing-planner.mjs'
      - 'tests/test_licensing_planner.mjs'
      - 'docs/AIRLINERRA_LICENCE2_*'
      - '.github/workflows/airlinerra-licence2-four-level-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licence2-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify read-only four-level game proposal
        run: |
          node --check website/licensing-planner.mjs
          node --check tests/test_licensing_planner.mjs
          node --test tests/test_licensing_planner.mjs
      - name: Validate website build
        run: |
          cd website
          npm run build
