      - 'supabase/migrations/20261112190000_section9_verified_starter_usage_tracking_baseline_v1.sql'
      - 'supabase/migrations/20261112191500_section9_game_fuel_model_snapshot_v1.sql'
      - 'supabase/migrations/20261113083000_section9_game_five_phase_fuel_preview_only_v1.sql'
      - 'supabase/migrations/20261113095000_section9_jetstream32_easa_usable_tank_capacity_v1.sql'
