name: Airlinerra Phase 1 operations (crew deferred)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261112164500_section9_phase1_no_crew_still_signed_five_certificates.sql'
      - 'supabase/migrations/20261112171500_section5_activation_readiness_excludes_crew_phase1.sql'
      - 'supabase/migrations/20261112181000_section9_owned_aircraft_operational_position_resolver_v1.sql'
      - 'supabase/migrations/20261112182500_section9_aircraft_position_resolver_record_alias_repair.sql'
      - 'supabase/migrations/20261112184000_section9_noncrew_preflight_verified_game_position.sql'
      - 'supabase/migrations/20261112190000_section9_verified_starter_usage_tracking_baseline_v1.sql'
      - 'supabase/migrations/20261112191500_section9_game_fuel_model_snapshot_v1.sql'
      - 'supabase/migrations/20261113083000_section9_game_five_phase_fuel_preview_only_v1.sql'
      - 'supabase/migrations/20261113095000_section9_jetstream32_easa_usable_tank_capacity_v1.sql'
      - 'tests/test_section9_verified_starter_usage_baseline.mjs'
      - 'tests/test_section9_game_fuel_snapshot.mjs'
      - 'tests/test_section9_game_five_phase_fuel_quote.mjs'
      - 'tests/test_section9_jetstream32_easa_fuel_capacity.mjs'
      - 'tests/test_section9_initial_position_phase1.mjs'
      - 'website/route-planner.mjs'
      - 'server/flight-schedule-service.mjs'
      - 'tests/test_section9_phase1_no_crew_activation.mjs'
      - 'docs/SECTION9_PHASE1_OPERATIONAL_MVP_NO_CREW.md'
      - '.github/workflows/airlinerra-section9-phase1-no-crew-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-certificate-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operational Phase 1 crew exception and five mandatory independent clearances
        run: node --test tests/test_section9_phase1_no_crew_activation.mjs tests/test_section9_initial_position_phase1.mjs tests/test_section9_verified_starter_usage_baseline.mjs tests/test_section9_game_fuel_snapshot.mjs tests/test_section9_game_five_phase_fuel_quote.mjs tests/test_section9_jetstream32_easa_fuel_capacity.mjs
      - name: Guard activated game code and protected build
        run: npm run build --prefix website
