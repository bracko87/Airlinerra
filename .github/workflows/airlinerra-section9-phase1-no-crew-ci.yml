      - 'supabase/migrations/20261113151500_section9_starter_game_commissioning_date_provenance_fix.sql'
      - 'supabase/migrations/20261113170000_section9_hourly_verified_maintenance_jobs_v1.sql'
      - 'supabase/migrations/20261113172000_section9_maintenance_job_aircraft_alias_repair.sql'
      - 'supabase/migrations/20261113174000_section9_maintenance_due_uses_game_job_receipts.sql'
      - 'supabase/migrations/20261113175000_section9_world1_maintenance_minute_cron.sql'
      - 'tests/test_section9_verified_starter_usage_baseline.mjs'
      - 'tests/test_section9_game_fuel_snapshot.mjs'
      - 'tests/test_section9_game_five_phase_fuel_quote.mjs'
      - 'tests/test_section9_jetstream32_easa_fuel_capacity.mjs'
      - 'tests/test_section9_maintenance_evidence_readiness.mjs'
      - 'tests/test_section9_starter_commissioning_workflow.mjs'
      - 'tests/test_section9_starter_game_data_inspection_v1.mjs'
      - 'tests/test_section9_commissioning_player_ui_v1.mjs'
      - 'tests/test_section9_starter_game_airframe_maintenance.mjs'
      - 'tests/test_section9_game_maintenance_jobs_hourly_v1.mjs'
      - 'website/flight-schedule-client.mjs'
      - 'website/airline-workspace.mjs'
      - 'tests/test_section9_initial_position_phase1.mjs'
      - 'website/route-planner.mjs'
      - 'server/flight-schedule-service.mjs'
      - 'tests/test_section9_phase1_no_crew_activation.mjs'
      - 'docs/SECTION9_PHASE1_OPERATIONAL_MVP_NO_CREW.md'
      - '.github/workflows/airlinerra-section9-phase1-no-crew-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-certificate-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operational Phase 1 crew exception and five mandatory independent clearances
        run: node --test tests/test_section9_phase1_no_crew_activation.mjs tests/test_section9_initial_position_phase1.mjs tests/test_section9_verified_starter_usage_baseline.mjs tests/test_section9_game_fuel_snapshot.mjs tests/test_section9_game_five_phase_fuel_quote.mjs tests/test_section9_jetstream32_easa_fuel_capacity.mjs tests/test_section9_maintenance_evidence_readiness.mjs tests/test_section9_starter_commissioning_workflow.mjs tests/test_section9_starter_game_data_inspection_v1.mjs tests/test_section9_commissioning_player_ui_v1.mjs tests/test_section9_starter_game_airframe_maintenance.mjs tests/test_section9_game_maintenance_jobs_hourly_v1.mjs
      - name: Guard activated game code and protected build
        run: npm run build --prefix website
