name: Refresh worldwide airport codes and coordinates (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airlinerra-identity-worldwide-manual
  cancel-in-progress: false

jobs:
  worldwide-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Airlinerra main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin current global OurAirports airport source and download once
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/davidmegginson/ourairports-data.git refs/heads/main | cut -f1)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "OURAIRPORTS_SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --retry 3 --max-time 160 "https://raw.githubusercontent.com/davidmegginson/ourairports-data/$SHA/airports.csv" --output "$RUNNER_TEMP/ourairports-airports.csv"
          test -s "$RUNNER_TEMP/ourairports-airports.csv"
      - name: Run isolated source/identity regression tests
        run: python -m unittest discover -s tests -p test_airport_identity_worldwide.py
      - name: Rebuild all 8153 airport source-ID matches in one pass
        shell: bash
        run: |
          set -euo pipefail
          python scripts/refresh_airport_identity_worldwide.py --airports "$RUNNER_TEMP/ourairports-airports.csv" --source-commit "$OURAIRPORTS_SOURCE_SHA"
          python scripts/refresh_airport_identity_worldwide.py --airports "$RUNNER_TEMP/ourairports-airports.csv" --source-commit "$OURAIRPORTS_SOURCE_SHA" --check
      - name: Validate original airport master remains untouched
        run: |
          python scripts/validate_airports.py
          python scripts/validate_historical_airports.py
          git diff --exit-code -- data/airports/airport_register.csv data/airports/fictional_airports.csv
      - name: Publish source-ID audit and remaining exceptions
        uses: actions/upload-artifact@v4
        with:
          name: airlinerra-8153-worldwide-airport-identity
          path: |
            data/airports/identity/airport_identity_worldwide.csv
            data/airports/identity/identity_exceptions.csv
            data/airports/identity/identity_summary.json
          if-no-files-found: error
      - name: Commit one consolidated non-operational identity refresh to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airports/identity/airport_identity_worldwide.csv data/airports/identity/identity_exceptions.csv data/airports/identity/identity_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh worldwide airport IDs codes and coordinates [skip ci]"
            git push origin HEAD:main
          fi
