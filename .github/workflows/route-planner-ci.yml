name: Airlinerra route planner and airport selectors (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'website/airport-country-picker.mjs'
      - 'website/airport-restriction-display.mjs'
      - 'website/route-aircraft-runway-screen.mjs'
      - 'server/airport-profile-service.mjs'
      - 'tests/test_airport_operating_restrictions_ui.mjs'
      - 'server/production-game-api.mjs'
      - 'website/player-read-client.mjs'
      - 'website/netlify/functions/airlinerra-game.mjs'
      - 'tests/test_production_game_api.mjs'
      - 'tests/test_route_restriction_preflight_api.mjs'
      - 'tests/test_route_aircraft_runway_screen.mjs'
      - 'website/airline-airports-office.mjs'
      - 'website/airline-workspace.mjs'
      - 'website/route-planner.mjs'
      - 'website/aircraft-weekly-timeline.mjs'
      - 'tests/test_aircraft_weekly_timeline.mjs'
      - 'website/route-map.mjs'
      - 'website/world-outlines.mjs'
      - 'website/player-app.css'
      - 'website/dev-scripts/invited-overlay.mjs'
      - 'website/package.json'
      - 'server/player-read-service.mjs'
      - 'tests/test_route_planner_ui.mjs'
      - '.github/workflows/route-planner-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and server module syntax
        run: |
          node --check website/airport-country-picker.mjs
          node --check website/airport-restriction-display.mjs
          node --check website/route-aircraft-runway-screen.mjs
          node --check server/airport-profile-service.mjs
          node --check server/production-game-api.mjs
          node --check website/player-read-client.mjs
          node --check website/dev-scripts/real-player-read-gateway.mjs
          node --check website/route-planner.mjs
          node --check website/aircraft-weekly-timeline.mjs
          node --check website/route-map.mjs
          node --check website/world-outlines.mjs
          node --check website/airline-airports-office.mjs
          node --check website/airline-workspace.mjs
          node --check server/player-read-service.mjs
      - name: Run focused airport and route planning tests
        run: |
          node --test tests/test_route_planner_ui.mjs tests/test_aircraft_weekly_timeline.mjs tests/test_airport_office_profiles.mjs tests/test_operations_center_navigation.mjs tests/test_airport_operating_restrictions_ui.mjs tests/test_production_game_api.mjs tests/test_route_restriction_preflight_api.mjs tests/test_route_aircraft_runway_screen.mjs
      - name: Build complete private website with new route modules
        working-directory: website
        run: npm run build
      - name: Verify aircraft timeline is served in distribution
        run: |
          test -s dist/aircraft-weekly-timeline.mjs
          grep -q 'buildAircraftWeeklyTimeline' dist/aircraft-weekly-timeline.mjs
