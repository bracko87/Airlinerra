        run: |
          node --test tests/test_section5_weather_preflight.mjs tests/test_route_planner_ui.mjs tests/test_route_draft_flow.mjs tests/test_owner_route_planning.mjs tests/test_aircraft_weekly_timeline.mjs tests/test_airport_office_profiles.mjs tests/test_operations_center_navigation.mjs tests/test_airport_operating_restrictions_ui.mjs tests/test_production_game_api.mjs tests/test_route_restriction_preflight_api.mjs tests/test_route_aircraft_runway_screen.mjs tests/test_server_flight_schedule_api.mjs tests/test_section6_slots.mjs tests/test_fleet_acquisition_api.mjs tests/test_local_owner_fleet_reader.mjs tests/test_real_local_player_gateway.mjs tests/test_section9_api_ui.mjs tests/test_section9_demand_allocation.mjs tests/test_section9_network_engine.mjs tests/test_section9_day_runner.mjs tests/test_section9_durable_worker.mjs tests/test_section9_settlement_preflight.mjs tests/test_section9_settlement_reader.mjs tests/test_section9_settlement_preparation_runner.mjs tests/test_section9_rotation_preflight.mjs tests/test_section9_shared_window.mjs tests/test_section9_shared_window_runner.mjs tests/test_section9_atomic_hold_runner.mjs tests/test_section9_durable_hold_runner.mjs tests/test_section9_verified_game_clock_ingress.mjs tests/test_section9_scheduled_game_day_producer.mjs tests/test_section9_delivery_position_worker.mjs tests/test_section9_operated_flight_movement_ingress.mjs tests/test_section9_verified_flight_operations_dispatcher.mjs tests/test_section9_aircraft_operations_worker.mjs tests/test_section9_activation_preparation_service.mjs tests/test_section9_signed_certification_ingress.mjs tests/test_section9_game_slot_clearance_issuer.mjs tests/test_section9_game_permission_verifier_issuer.mjs tests/test_section9_game_permission_applications.mjs tests/test_section9_permission_player_api_ui.mjs tests/test_section9_route_financial_dashboard.mjs tests/test_group2_1118_airport_cohort.mjs tests/test_group2_independent_admission_gates.mjs tests/test_group2_batch1_desk_research.mjs tests/test_group2_section1_source_audit.mjs tests/test_section9_commercial_api.mjs tests/test_airline_workspace.mjs
      - name: Build complete private website with new route modules
        working-directory: website
        run: npm run build
      - name: Smoke-test real built localhost fleet HTTP dispatch
        run: node --test tests/test_local_fleet_http_dispatch.mjs
      - name: Verify complete player ES module dependency graph in built website
        run: |
          node --test tests/test_player_built_module_graph.mjs
          test -s dist/game-permission-applications-client.mjs
          test -s dist/game-permission-applications-view.mjs
      - name: Verify aircraft timeline is served in distribution
        run: |
          test -s dist/aircraft-weekly-timeline.mjs
          grep -q 'buildAircraftWeeklyTimeline' dist/aircraft-weekly-timeline.mjs
          test -s dist/section9-route-details.mjs
          test -s dist/section9-route-finance-panel.mjs
          test -s dist/section9-rotation-review.mjs
          test -s dist/section9-partner-console.mjs
          test -s dist/section9-commercial-plan-editor.mjs
          test -s dist/flight-schedule-client.mjs
          grep -q 'createFlightScheduleClient' dist/flight-schedule-client.mjs
