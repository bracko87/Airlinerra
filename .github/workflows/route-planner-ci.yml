          node --check server/section9-shared-window-engine.mjs
          node --check server/section9-shared-window-runner.mjs
          node --check server/section9-atomic-hold-runner.mjs
          node --check server/section9-durable-hold-runner.mjs
          node --check server/section9-verified-game-clock-ingress.mjs
          node --check server/section9-scheduled-game-day-producer.mjs
          node --check server/section9-clock-job-handler.mjs
          node --check server/section9-delivery-position-worker.mjs
          node --check server/section9-operated-flight-movement-ingress.mjs
          node --check server/section9-verified-flight-operations-dispatcher.mjs
          node --check server/section9-aircraft-operations-worker.mjs
          node --check server/section9-activation-preparation-service.mjs
          node --check server/section9-signed-certification-ingress.mjs
