permissions:
  contents: read
jobs:
  route-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and server module syntax
        run: |
          node --check website/airport-country-picker.mjs
          node --check website/airport-restriction-display.mjs
          node --check website/route-aircraft-runway-screen.mjs
          node --check server/airport-profile-service.mjs
          node --check server/production-game-api.mjs
          node --check server/flight-schedule-service.mjs
          node --check server/flight-weather-reference.mjs
          node --check server/fleet-acquisition-service.mjs
