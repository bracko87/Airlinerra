          node --check server/section9-settlement-preflight-runner.mjs
          node --check server/section9-settlement-preparation-runner.mjs
          node --check website/section9-partner-console.mjs
          node --check website/section9-commercial-plan-editor.mjs
          node --check website/aircraft-weekly-timeline.mjs
          node --check website/route-map.mjs
          node --check website/world-outlines.mjs
          node --check website/airline-airports-office.mjs
          node --check website/airline-workspace.mjs
          node --check server/player-read-service.mjs
