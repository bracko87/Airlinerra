name: Holding ownership and treasury foundation (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/holding-finance-contract.mjs'
      - 'server/player-read-service.mjs'
      - 'server/canonical-game-api.mjs'
      - 'website/player-read-client.mjs'
      - 'website/player-app.mjs'
      - 'website/private-player-app.html'
      - 'tests/test_holding_finance_contract.mjs'
      - 'tests/test_player_read_api.mjs'
      - 'tests/test_strategic_navigation.mjs'
      - 'docs/sql/AIRLINERRA_HOLDING_OWNERSHIP_FINANCE_V1_2026-11-08.sql'
      - '.github/workflows/holding-finance-foundation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Module syntax checks
        run: |
          node --check server/holding-finance-contract.mjs
          node --check server/player-read-service.mjs
          node --check server/canonical-game-api.mjs
          node --check website/player-read-client.mjs
          node --check website/player-app.mjs
      - name: Verified eligibility, safe money and browser read-only tests
        run: |
          node --test \
            tests/test_holding_finance_contract.mjs \
            tests/test_player_read_api.mjs \
            tests/test_strategic_navigation.mjs
