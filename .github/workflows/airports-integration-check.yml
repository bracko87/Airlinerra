name: Airlinerra airport integration safeguards
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'website/**'
      - 'tests/test_player_read_api.mjs'
      - 'tests/test_real_local_player_gateway.mjs'
      - 'tests/test_player_app_prelaunch.mjs'
      - 'tests/test_route_planner_ui.mjs'
      - 'tests/test_airport_profile_database_integration.mjs'
      - '.github/workflows/airports-integration-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airport-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source-level airport safeguards
        run: |
          node --test \
            tests/test_player_read_api.mjs \
            tests/test_real_local_player_gateway.mjs \
            tests/test_player_app_prelaunch.mjs \
            tests/test_route_planner_ui.mjs \
            tests/test_airport_profile_database_integration.mjs
      - name: Verify static invited-only player build
        working-directory: website
        run: npm run build
