name: Aircraft storage phase review
on:
  pull_request:
  push:
    branches: [feature/aircraft-leasing-billing-review]
    paths:
      - 'server/sql/aircraft_storage*'
      - '.github/workflows/airlinerra-storage-phase-review.yml'
jobs:
  storage-phase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: review
          POSTGRES_DB: review
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: review
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated storage phase acceptance
        shell: bash
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1 <<'SQL'
          -- Disposable test DB only.
          CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;
          CREATE SCHEMA airlinerra; CREATE SCHEMA airlinerra_game;
          CREATE TABLE airlinerra.airport_registry(airport_key text PRIMARY KEY);
          INSERT INTO airlinerra.airport_registry SELECT 'OURAIRPORTS:'||n FROM unnest(ARRAY[26900,4073,3856,316427,19330,2409,2395,21315,20507,20594,999]) n;
          CREATE TABLE airlinerra_game.airport_reference_profiles(world_id smallint,airport_key text,latitude_deg numeric,longitude_deg numeric,timezone_iana text);
          CREATE TABLE airlinerra_game.airport_unified_operations_v1(world_id smallint,airport_key text,game_category text,operationally_authorized boolean,dispatch_eligible_by_airport_admission boolean);
          INSERT INTO airlinerra_game.airport_reference_profiles VALUES(1,'OURAIRPORTS:999',48,2,'Europe/Paris');
          INSERT INTO airlinerra_game.airport_unified_operations_v1 VALUES(1,'OURAIRPORTS:999','Large',true,true);
          CREATE TABLE airlinerra_game.section9_game_fuel_model_snapshot_v1(configuration_id bigint,cruise_speed_kmh numeric,game_calculation_ready boolean);
          CREATE TABLE airlinerra.aircraft_catalog_configuration_inventory(configuration_id bigint,mtow_kg numeric);
          INSERT INTO airlinerra_game.section9_game_fuel_model_snapshot_v1 VALUES(1,800,true);
          INSERT INTO airlinerra.aircraft_catalog_configuration_inventory VALUES(1,70000);
          CREATE FUNCTION airlinerra_game.section9_route_timing_pick_v1(text,int,int) RETURNS int LANGUAGE sql IMMUTABLE AS 'SELECT ($2+$3)/2';
          CREATE TABLE airlinerra_game.section8_airport_operating_tariffs_v1(world_id smallint,airport_key text,landing_base_for_reference_aircraft_usd numeric,departure_movement_fraction numeric,ground_handling_fraction numeric,remote_stand_multiplier numeric,remote_parking_reference_per_day_usd numeric,terminal_navigation_unit_usd numeric,price_model_version text,evidence_class text);
          INSERT INTO airlinerra_game.section8_airport_operating_tariffs_v1 VALUES(1,'OURAIRPORTS:999',1000,0.16,0.2,1,100,50,'fixture','GAME_ESTIMATE_NOT_REAL_AERONAUTICAL_TARIFF');
          CREATE TABLE airlinerra.aircraft_expansion_group3_economics_v1(fuel_price_assumption_usd_per_kg numeric);
          INSERT INTO airlinerra.aircraft_expansion_group3_economics_v1 VALUES(1.2);
          CREATE FUNCTION airlinerra_game.section9_game_reserve_aware_fuel_quote_v1(bigint,numeric,integer,integer,integer,integer,integer) RETURNS jsonb LANGUAGE sql AS 'SELECT jsonb_build_object(''status'',''game_reserve_aware_fuel_estimate_only'',''tripBurnKg'',1000,''withinGameTankIncludingReserve'',true)';
          CREATE TABLE airlinerra_game.airlines(id uuid PRIMARY KEY,world_id smallint,owner_player_id uuid,cash_usd numeric);
          CREATE TABLE airlinerra_game.world_memberships(world_id smallint,player_id uuid,state text);
          CREATE TABLE airlinerra_game.airline_aircraft_inventory(id uuid PRIMARY KEY,airline_id uuid,configuration_id bigint,ownership_type text,fleet_status text);
          CREATE TABLE airlinerra_game.airline_flight_schedule_drafts_v1(airline_id uuid,aircraft_inventory_id uuid,status text);
          CREATE TABLE airlinerra_game.section9_game_maintenance_jobs_v1(airline_id uuid,aircraft_inventory_id uuid,status text,quoted_cost_usd numeric);
          CREATE TABLE airlinerra_game.section9_maintenance_relocation_trips_v1(airline_id uuid,aircraft_inventory_id uuid,status text,quoted_total_usd numeric);
          CREATE TABLE airlinerra_game.airline_ledger(airline_id uuid,amount_usd numeric);
          CREATE TABLE airlinerra_game.section6_airport_slot_capacity_v1(world_id smallint,airport_key text,remote_stands integer,remote_per_direction_10m integer,PRIMARY KEY(world_id,airport_key));
          CREATE TABLE airlinerra_game.section5_airport_operating_policy_v1(world_id smallint,airport_key text,timezone_iana text);
          CREATE TABLE airlinerra_game.section6_weekly_airport_slot_reservations_v1(world_id smallint,airport_key text,stand_type text,direction text,weekday smallint,minute_of_day smallint);
          CREATE TABLE airlinerra_game.section6_dated_relocation_slots_v1(world_id smallint,airport_key text,stand_type text,direction text,local_date date,weekday smallint,minute_of_day smallint);
          CREATE TABLE airlinerra_game.section9_dated_replacement_slots_v1(LIKE airlinerra_game.section6_dated_relocation_slots_v1);
          CREATE FUNCTION airlinerra_game.section9_verified_world_instant_v1() RETURNS timestamptz LANGUAGE sql STABLE AS 'SELECT ''2026-11-26 10:00+00''::timestamptz';
          CREATE FUNCTION airlinerra_game.section9_owned_aircraft_operational_position_v1(uuid,uuid,uuid,date) RETURNS jsonb LANGUAGE sql STABLE AS 'SELECT jsonb_build_object(''verified'',true,''atGroundAirport'',true,''airportKey'',''OURAIRPORTS:999'')';
          INSERT INTO airlinerra_game.airlines VALUES('00000000-0000-0000-0000-000000000001',1,'00000000-0000-0000-0000-000000000002',5000000);
          INSERT INTO airlinerra_game.world_memberships VALUES(1,'00000000-0000-0000-0000-000000000002','active');
          INSERT INTO airlinerra_game.airline_aircraft_inventory VALUES('00000000-0000-0000-0000-000000000003','00000000-0000-0000-0000-000000000001',1,'owned','in_service');
          INSERT INTO airlinerra_game.airline_ledger VALUES('00000000-0000-0000-0000-000000000001',5000000);
          INSERT INTO airlinerra_game.section6_airport_slot_capacity_v1 VALUES(1,'OURAIRPORTS:999',1,1);
          INSERT INTO airlinerra_game.section5_airport_operating_policy_v1 VALUES(1,'OURAIRPORTS:999','Europe/Paris');
          SQL
          for file in aircraft_storage_facilities_review aircraft_storage_airport_admission_review aircraft_storage_route_phase_review aircraft_storage_relocation_cost_review aircraft_storage_relocation_request_review aircraft_storage_flight_slots_review aircraft_storage_leg_evidence_review; do
            psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1 -f "server/sql/$file.sql"
          done
          psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE j jsonb; a jsonb;
          BEGIN
           IF airlinerra_game.aircraft_storage_route_phase_profile_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','storage_inbound') IS NOT NULL THEN RAISE EXCEPTION 'unapproved candidate accepted';END IF;
           UPDATE airlinerra_game.aircraft_storage_facilities_v1 SET review_state='approved',monthly_regional_usd=2000,monthly_narrowbody_usd=5000,monthly_widebody_usd=10000,reactivation_allowed=true,evidence_reference='synthetic',relocation_release_reference='synthetic',reviewed_at=now() WHERE airport_key='OURAIRPORTS:316427';
           INSERT INTO airlinerra_game.aircraft_storage_airport_operational_profiles_v1 VALUES(1,'OURAIRPORTS:316427',40,-1,'Europe/Madrid',2800,45,'asphalt',1000,150,'synthetic','synthetic',now());
           j:=airlinerra_game.aircraft_storage_route_phase_profile_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','storage_inbound');
           IF j IS NULL OR (j->>'distanceKm')::numeric<=0 OR (j->>'totalMinutes')::integer<=0 THEN RAISE EXCEPTION 'inbound quote missing';END IF;
           IF (j->>'totalMinutes')::integer <> (j->>'taxiOutMinutes')::integer+(j->>'taxiInMinutes')::integer+(j->>'climbMinutes')::integer+(j->>'cruiseMinutes')::integer+(j->>'descentMinutes')::integer THEN RAISE EXCEPTION 'phase sum mismatch';END IF;
           IF airlinerra_game.aircraft_storage_route_phase_profile_v1(1,'OURAIRPORTS:316427','OURAIRPORTS:999','storage_reactivation') IS NULL THEN RAISE EXCEPTION 'reactivation quote missing';END IF;
           IF airlinerra_game.aircraft_storage_route_phase_profile_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','commercial') IS NOT NULL THEN RAISE EXCEPTION 'commercial accepted';END IF;
           IF EXISTS(SELECT 1 FROM airlinerra_game.airport_unified_operations_v1 WHERE airport_key='OURAIRPORTS:316427') THEN RAISE EXCEPTION 'commercial catalogue changed';END IF;
           a:=airlinerra_game.aircraft_storage_airport_admission_v1('OURAIRPORTS:316427','storage_inbound');
           IF a->>'dispatchAuthorized' IS DISTINCT FROM 'false' OR a->>'storageCapacityUnlimited' IS DISTINCT FROM 'true' THEN RAISE EXCEPTION 'incorrect release flags';END IF;
           j:=airlinerra_game.aircraft_storage_relocation_cost_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','storage_inbound');
           IF j->>'status' IS DISTINCT FROM 'storage_tariff_unavailable' THEN RAISE EXCEPTION 'missing tariff not rejected';END IF;
           INSERT INTO airlinerra_game.aircraft_storage_relocation_tariffs_v1 VALUES(1,'OURAIRPORTS:316427',100,200,50,'fixture');
           j:=airlinerra_game.aircraft_storage_relocation_cost_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','storage_inbound');
           IF j->>'status' IS DISTINCT FROM 'storage_relocation_cost_estimate' OR (j->>'fuelCostUsd')::numeric IS DISTINCT FROM 1200::numeric OR (j->>'airportFeesUsd')::numeric IS DISTINCT FROM 1498.13::numeric OR (j->>'directOperatingCostUsd')::numeric IS DISTINCT FROM 2698.13::numeric THEN RAISE EXCEPTION 'inbound cost mismatch: %',j;END IF;
           IF j->>'passengers' IS DISTINCT FROM '0' OR j->>'cargoTonnes' IS DISTINCT FROM '0' OR j->>'dispatchAuthorized' IS DISTINCT FROM 'false' THEN RAISE EXCEPTION 'unsafe release flags';END IF;
           j:=airlinerra_game.aircraft_storage_relocation_cost_v1(1,'OURAIRPORTS:316427','OURAIRPORTS:999','storage_reactivation');
           IF j->>'status' IS DISTINCT FROM 'storage_relocation_cost_estimate' OR (j->>'airportFeesUsd')::numeric IS DISTINCT FROM 1488.13::numeric THEN RAISE EXCEPTION 'return cost mismatch: %',j;END IF;
           UPDATE airlinerra_game.aircraft_storage_facilities_v1 SET review_state='suspended' WHERE airport_key='OURAIRPORTS:316427';
           IF airlinerra_game.aircraft_storage_route_phase_profile_v1(1,'OURAIRPORTS:999','OURAIRPORTS:316427','storage_inbound') IS NOT NULL THEN RAISE EXCEPTION 'suspended facility accepted';END IF;
           RAISE NOTICE 'Storage phase acceptance passed';
          END $test$;
          DO $slots$
          DECLARE physical text; payload text; a uuid:='00000000-0000-0000-0000-000000000001';p uuid:='00000000-0000-0000-0000-000000000002';f uuid:='00000000-0000-0000-0000-000000000003';k uuid:='00000000-0000-0000-0000-000000000004';r uuid;j jsonb;
          BEGIN
           UPDATE airlinerra_game.aircraft_storage_facilities_v1 SET review_state='approved' WHERE airport_key='OURAIRPORTS:316427';
           INSERT INTO airlinerra_game.aircraft_storage_only_movement_limits_v1 VALUES(1,'OURAIRPORTS:316427',1,1,'fixture');
           j:=airlinerra_game.request_aircraft_storage_relocation_v1(p,a,f,'OURAIRPORTS:316427','2026-11-26 12:00+00',2698.13,k);
           IF j->>'created' IS DISTINCT FROM 'true' THEN RAISE EXCEPTION 'request creation: %',j;END IF;
           r:=(j->>'requestId')::uuid;
           physical:=r::text||':2026-11-26:1';
           IF EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_leg_evidence_v1(physical)) THEN RAISE EXCEPTION 'unreserved evidence accepted';END IF;
           j:=airlinerra_game.request_aircraft_storage_relocation_v1(p,a,f,'OURAIRPORTS:316427','2026-11-26 12:00+00',2698.13,k);
           IF j->>'replayed' IS DISTINCT FROM 'true' THEN RAISE EXCEPTION 'request replay: %',j;END IF;
           INSERT INTO airlinerra_game.section6_weekly_airport_slot_reservations_v1 VALUES(1,'OURAIRPORTS:999','remote','departure',3,780);
           j:=airlinerra_game.reserve_aircraft_storage_slots_v1(p,a,r);
           IF j->>'status' IS DISTINCT FROM 'STORAGE_FLIGHT_SLOT_UNAVAILABLE' OR EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_flight_slots_v1 WHERE request_id=r) THEN RAISE EXCEPTION 'atomic slot failure: %',j;END IF;
           DELETE FROM airlinerra_game.section6_weekly_airport_slot_reservations_v1;
           j:=airlinerra_game.reserve_aircraft_storage_slots_v1(p,a,r);
           IF j->>'slotsReserved' IS DISTINCT FROM '2' OR j->>'flightScheduled' IS DISTINCT FROM 'false' THEN RAISE EXCEPTION 'slot reservation: %',j;END IF;
           j:=airlinerra_game.reserve_aircraft_storage_slots_v1(p,a,r);
           IF j->>'replayed' IS DISTINCT FROM 'true' THEN RAISE EXCEPTION 'slot replay: %',j;END IF;
           BEGIN
           INSERT INTO airlinerra_game.section6_weekly_airport_slot_reservations_v1 VALUES(1,'OURAIRPORTS:999','remote','departure',3,780);
           RAISE EXCEPTION 'unexpected commercial slot';
           EXCEPTION WHEN raise_exception THEN IF SQLERRM<>'STORAGE_FLIGHT_SLOT_UNAVAILABLE' THEN RAISE;END IF;END;
           BEGIN
           INSERT INTO airlinerra_game.section9_dated_replacement_slots_v1 VALUES(1,'OURAIRPORTS:999','remote','departure','2026-11-26',3,780);
           RAISE EXCEPTION 'unexpected replacement slot';
           EXCEPTION WHEN raise_exception THEN IF SQLERRM<>'STORAGE_FLIGHT_SLOT_UNAVAILABLE' THEN RAISE;END IF;END;
           IF NOT EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_leg_evidence_v1(physical)) THEN RAISE EXCEPTION 'reserved evidence missing';END IF;
           payload:=airlinerra_game.aircraft_storage_event_signing_payload_v1(physical,'departed');
           IF payload IS NULL OR split_part(payload,E'\n',1)<>'airlinerra-storage-event-v1' OR split_part(payload,E'\n',5)<>'departed' OR airlinerra_game.aircraft_storage_event_signing_payload_v1(physical,'arrived') IS NOT DISTINCT FROM payload THEN RAISE EXCEPTION 'signing payload mismatch';END IF;
           IF airlinerra_game.aircraft_storage_event_signing_payload_v1(physical,'invalid') IS NOT NULL THEN RAISE EXCEPTION 'invalid phase accepted';END IF;
           UPDATE airlinerra_game.airline_aircraft_inventory SET configuration_id=2 WHERE id=f;
           IF EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_leg_evidence_v1(physical)) THEN RAISE EXCEPTION 'changed configuration accepted';END IF;
           UPDATE airlinerra_game.airline_aircraft_inventory SET configuration_id=1 WHERE id=f;
           j:=airlinerra_game.cancel_aircraft_storage_relocation_request_v1(p,a,r);
           IF EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_leg_evidence_v1(physical)) THEN RAISE EXCEPTION 'cancelled evidence accepted';END IF;
           IF j->>'status' IS DISTINCT FROM 'cancelled' OR EXISTS(SELECT 1 FROM airlinerra_game.aircraft_storage_flight_slots_v1 WHERE request_id=r) THEN RAISE EXCEPTION 'slot release failed';END IF;
           INSERT INTO airlinerra_game.section6_weekly_airport_slot_reservations_v1 VALUES(1,'OURAIRPORTS:999','remote','departure',3,780);
           IF (SELECT cash_usd FROM airlinerra_game.airlines WHERE id=a)<>5000000 OR (SELECT fleet_status FROM airlinerra_game.airline_aircraft_inventory WHERE id=f)<>'in_service' THEN RAISE EXCEPTION 'unexpected financial or fleet mutation';END IF;
           RAISE NOTICE 'Storage request and slot acceptance passed';
          END $slots$;
          SQL
          psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1 -f tests/sql/aircraft_storage_signed_movement_fixture.sql
          # Run acceptance inside the review transaction, then roll back.
          { sed '/^ROLLBACK;$/d' server/sql/aircraft_storage_signed_movement_schema_review.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_funds_review.sql; sed '/^ROLLBACK;$/d' tests/sql/aircraft_storage_signed_movement_acceptance.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_arrival_completion_review.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_monthly_billing_review.sql; echo "INSERT INTO airlinerra_game.aircraft_storage_billing_classes_v1 VALUES(1,'narrowbody','fixture');"; sed '/^ROLLBACK;$/d' tests/sql/aircraft_storage_arrival_completion_acceptance.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_reactivation_request_review.sql; cat tests/sql/aircraft_storage_reactivation_request_acceptance.sql; cat tests/sql/aircraft_storage_monthly_billing_acceptance.sql; } | psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1
          # Compile worker with the same storage schemas and a disabled synthetic fuel release.
          { sed '/^ROLLBACK;$/d' server/sql/aircraft_storage_signed_movement_schema_review.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_funds_review.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_arrival_completion_review.sql; sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_monthly_billing_review.sql; cat <<'SQL'
          CREATE TABLE airlinerra_game.aircraft_storage_execution_release_v1(world_id smallint PRIMARY KEY,fuel_adapter_enabled boolean NOT NULL DEFAULT false,execution_enabled boolean NOT NULL DEFAULT false);
          INSERT INTO airlinerra_game.aircraft_storage_execution_release_v1(world_id) VALUES(1);
          SQL
          sed -e '/^BEGIN;$/d' -e '/^ROLLBACK;$/d' server/sql/aircraft_storage_execution_worker_review.sql; cat <<'SQL'
          DO $worker$
          DECLARE j jsonb;
          BEGIN
           j:=airlinerra_game.advance_aircraft_storage_relocations_v1(10);
           IF j->>'status' IS DISTINCT FROM 'storage_execution_not_released' OR j->'results' IS DISTINCT FROM '[]'::jsonb THEN RAISE EXCEPTION 'worker release bypass: %',j;END IF;
           j:=airlinerra_game.execute_aircraft_storage_leg_v1(gen_random_uuid(),'departed');
           IF j->>'status' IS DISTINCT FROM 'storage_execution_not_released' OR j->>'movementRecorded' IS DISTINCT FROM 'false' THEN RAISE EXCEPTION 'direct execution release bypass: %',j;END IF;
           IF EXISTS(SELECT 1 FROM airlinerra_game.section9_operated_flight_movements_v1) THEN RAISE EXCEPTION 'disabled worker wrote movements';END IF;
           RAISE NOTICE 'Storage worker disabled release acceptance passed';
          END $worker$;
          ROLLBACK;
          SQL
          } | psql -h localhost -U postgres -d review -v ON_ERROR_STOP=1
