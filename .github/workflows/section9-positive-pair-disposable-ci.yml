name: Disposable positive FRA-MUC certified pair activation
on:
  push:
    branches: [main, commercial-flight-lifecycle]
    paths:
      - 'tests/sql/section9_disposable_roundtrip_*.sql'
      - 'server/sql/section9_completed_game_flight_cost_approval.sql'
      - 'server/sql/section9_commercial_flight_dispatch_fix.sql'
      - 'tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql'
      - 'tests/sql/section9_disposable_positive_fra_muc_pair_acceptance.sql'
      - 'supabase/migrations/20261117130000_section9_atomic_certified_pair_ticket_activation_v1.sql'
      - '.github/workflows/section9-positive-pair-disposable-ci.yml'
  pull_request:
    paths:
      - 'tests/sql/section9_disposable_roundtrip_*.sql'
      - 'server/sql/section9_completed_game_flight_cost_approval.sql'
      - 'server/sql/section9_commercial_flight_dispatch_fix.sql'
      - '.github/workflows/section9-positive-pair-disposable-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fra-muc-positive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=30000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify fresh disposable Postgres before DDL
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGPORT" = '5432'
          test "$PGUSER" = 'postgres'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
      - name: Bootstrap controlled FRA-MUC reciprocal route, certification and inventory fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql
      - name: Extract and install unchanged production roundtrip activation SQL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261117130000_section9_atomic_certified_pair_ticket_activation_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(',start)
          source=s[start:end]
          assert 'END $function$' in source
          assert 'SECTION9_PAIR_TICKET_INVENTORY_FAILED_FULL_ROLLBACK' in source
          Path('/tmp/section9-pair-actual.sql').write_text(source)
          print('Unchanged production pair-activation function extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/section9-pair-actual.sql
      - name: Test positive dual-leg activation, three atomic rollbacks, capacity and replay
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_acceptance.sql
      - name: Continue the same activated roundtrip through actual flight dispatch
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_roundtrip_dispatch_fixture.sql
          python3 - <<'PY'
          from pathlib import Path
          root=Path('supabase/migrations')
          fuel=(root/'20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql').read_text()
          usage=(root/'20261113233000_section9_once_only_arrival_airframe_hours_cycles_v1.sql').read_text()
          movement=(root/'20261113232000_section9_private_signed_operated_flight_dispatch_v1.sql').read_text()
          dispatch=Path('server/sql/section9_commercial_flight_dispatch_fix.sql').read_text()
          def extract(src,name):
              marker='CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'('
              start=src.index(marker)
              end=src.find('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
              if end<0: end=len(src)
              body=src[start:end]
              assert 'END $function$' in body
              return body
          out=[
              fuel[:fuel.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_verify_game_fuel_before_departure_v1')],
              usage[:usage.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_apply_arrival_airframe_usage_once_v1')],
              extract(movement,'section9_record_signed_operated_flight_movement_v1'),
              extract(fuel,'section9_capture_verified_departure_fuel_v1'),
              extract(fuel,'section9_apply_verified_arrival_fuel_burn_once_v1'),
              extract(usage,'section9_apply_arrival_airframe_usage_once_v1'),
              extract(dispatch,'section9_auto_dispatch_due_flight_events_v1')
          ]
          Path('/tmp/section9-actual-dispatch.sql').write_text('\n'.join(out))
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/section9-actual-dispatch.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_roundtrip_dispatch_acceptance.sql
      - name: Settle the same operated pair using actual preparation and posting functions
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_roundtrip_finance_fixture.sql
          python3 - <<'PY'
          from pathlib import Path
          root=Path('supabase/migrations')
          fuel=(root/'20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql').read_text()
          prep=(root/'20261117093000_section9_actual_ticket_postarrival_unposted_finance_v1.sql').read_text()
          final=(root/'20261117095000_section9_once_only_final_flight_finance_guarded_v1.sql').read_text()
          tickets=(root/'20261113225000_section9_postarrival_ticket_revenue_reconciliation_v1.sql').read_text()
          batch=(root/'20261117094000_section9_auto_prepare_actual_ticket_finance_v1.sql').read_text()
          fixture=Path('tests/sql/section9_disposable_real_settlement_bootstrap.sql').read_text()
          def extract(src,name):
              marker='CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'('
              start=src.index(marker)
              end=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
              return src[start:end]
          posted=fixture[fixture.index('CREATE TABLE airlinerra_game.section9_route_posted_flight_financials_v1('):]
          posted=posted[:posted.index(';')+1]
          approval=final[final.index('CREATE TABLE IF NOT EXISTS airlinerra_game.section9_flight_final_cost_approvals_v1('):final.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_verify_operated_flight_hmac_pair_v1(')]
          out=[
              posted,
              prep[:prep.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_prepare_actual_ticket_postarrival_finance_v1(')],
              approval,
              extract(tickets,'section9_postarrival_ticket_reconciliation_v1'),
              extract(fuel,'section9_prepare_actual_ticket_postarrival_finance_v1'),
              extract(batch,'section9_prepare_arrived_actual_ticket_finance_batch_v1'),
              extract(final,'section9_verify_operated_flight_hmac_pair_v1'),
              extract(final,'section9_post_completed_flight_finance_once_v1'),
              extract(final,'section9_auto_post_complete_game_flights_v1')
          ]
          Path('/tmp/section9-pair-finance.sql').write_text('\n'.join(out))
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/section9-pair-finance.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/section9_completed_game_flight_cost_approval.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_roundtrip_finance_acceptance.sql
      - name: Summary of isolation
        if: always()
        run: |
          echo '### FRA-MUC positive atomic activation on disposable PostgreSQL 17' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual pair activation, dispatcher, movement, fuel, airframe usage, ticket reconciliation, financial preparation and posting SQL are exercised in one database. Clock, permissions, booking data, fuel planning and tariff quotes are controlled fixtures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production schema, player aircraft, airline balances, real licences, signed source certifications, bookings, or flight movements changed.' >> "$GITHUB_STEP_SUMMARY"
