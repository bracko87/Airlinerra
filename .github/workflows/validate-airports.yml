name: Validate Airlinerra airport registers

on:
  push:
    branches: [staging]
    paths:
      - 'data/airports/**'
      - 'scripts/validate_airports.py'
      - 'scripts/validate_historical_airports.py'
      - 'scripts/rebuild_runway_register.py'
      - 'scripts/screen_group4.py'
      - 'scripts/screen_group5.py'
      - 'scripts/screen_group6.py'
      - 'scripts/screen_group7.py'
      - 'scripts/screen_group8.py'
      - 'scripts/screen_group9.py'
      - 'scripts/screen_group10.py'
      - 'scripts/screen_group11.py'
      - 'scripts/screen_group12.py'
      - 'scripts/screen_group13.py'
      - 'scripts/screen_group14.py'
      - 'scripts/screen_group15.py'
      - 'scripts/screen_group16.py'
      - 'scripts/screen_group17.py'
      - 'scripts/screen_group18.py'
      - 'scripts/screen_group19.py'
      - 'scripts/screen_group20.py'
      - 'scripts/screen_group21.py'
      - 'scripts/screen_group22.py'
      - 'scripts/screen_group23.py'
      - 'scripts/screen_group24.py'
      - 'scripts/screen_group25.py'
      - 'scripts/screen_group26.py'
      - 'scripts/screen_group27.py'
      - 'scripts/screen_group28.py'
      - 'scripts/screen_group29.py'
      - 'scripts/screen_group30.py'
      - 'scripts/airport_surface.py'
      - '.github/workflows/validate-airports.yml'
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  airport-register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate airport CSV
        run: |
          python scripts/validate_airports.py
          python scripts/validate_historical_airports.py
          python scripts/rebuild_runway_register.py
          git diff --exit-code -- data/airports/airport_register.csv data/airports/airport_code_conflicts.csv
