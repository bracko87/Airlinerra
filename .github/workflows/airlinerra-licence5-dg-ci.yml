name: Airlinerra Dangerous Goods Licence 5 (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/section9-permission-player-http.mjs'
      - 'website/game-permission-applications-client.mjs'
      - 'website/game-permission-applications-view.mjs'
      - 'website/licensing-planner.mjs'
      - 'supabase/migrations/*licence5*'
      - 'tests/test_licence5_dangerous_goods_fullflow.mjs'
      - '.github/workflows/airlinerra-licence5-dg-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dangerous-goods-licence5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check player and test syntax
        run: |
          node --check server/section9-permission-player-http.mjs
          node --check website/game-permission-applications-client.mjs
          node --check website/game-permission-applications-view.mjs
          node --check tests/test_licence5_dangerous_goods_fullflow.mjs
      - name: Verify Licence 5 applications and dangerous-goods safety contract
        run: node --test tests/test_licence5_dangerous_goods_fullflow.mjs
      - name: Build player website
        run: |
          cd website
          npm run build
