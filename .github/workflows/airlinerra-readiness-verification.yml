name: Airlinerra frontend readiness verification

on:
  push:
    branches:
      - phase-14h-crew-integration
    paths:
      - 'website/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/airlinerra-readiness-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout development source
        uses: actions/checkout@v5
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install pinned website dependencies
        run: npm ci
      - name: Run readiness API and frontend regression tests
        run: npm run test:route-readiness
      - name: Run website regression tests
        run: npm test
      - name: Verify production-style static build
        run: npm run build
      - name: Verify compiled readiness modules
        run: |
          test -f ../dist/section9-route-details.mjs
          test -f ../dist/section9-certification-records.mjs
          test -f ../dist/section9-operational-evidence.mjs

  disposable-pair-activation:
    name: Disposable PostgreSQL 17 certified round-trip acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=30000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v5
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify fresh disposable Postgres before DDL
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGPORT" = '5432'
          test "$PGUSER" = 'postgres'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
      - name: Bootstrap controlled FRA-MUC reciprocal route, certification and inventory fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql
      - name: Extract and install unchanged production roundtrip activation SQL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261117130000_section9_atomic_certified_pair_ticket_activation_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(',start)
          source=s[start:end]
          assert 'END $function$' in source
          assert 'SECTION9_PAIR_TICKET_INVENTORY_FAILED_FULL_ROLLBACK' in source
          Path('/tmp/section9-pair-actual.sql').write_text(source)
          print('Unchanged production pair-activation function extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/section9-pair-actual.sql
      - name: Test positive dual-leg activation, three atomic rollbacks, capacity and replay
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_acceptance.sql
      - name: Verify unchanged production direct booking SQL on disposable fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_reserve_verified_game_passenger_seats_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_reserve_verified_game_passenger_seats_v1(',start)
          source=s[start:end]
          assert len(source)>8000 and len(source)<12000
          assert source.index('FOR UPDATE OF cap')<source.index('FOR UPDATE OF o')
          assert 'SECTION9_PASSENGER_RESERVATION_ENGINE_ONLY' in source
          assert 'ledgerPosted' in source
          Path('/tmp/section9-direct-booking-actual.sql').write_text(source)
          print('Original direct booking migration source extracted without modifications')
          PY
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_booking_acceptance.sql
      - name: Exercise isolated cancellation transaction rollback and replay lab
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_cancellation_transaction_lab.sql
      - name: Race booking and cancellation in both row-lock orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_cancellation_race_acceptance.sh
      - name: Test inventory-first booking cancellation races in both orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_inventory_first_lock_race.sh
      - name: Race unchanged game booking SQL with isolated cancellation candidate
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_real_booking_cancel_race.sh
      - name: Verify both legs protected by pending connecting journey records
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_connecting_hold_guard.sql
      - name: Test unchanged connecting-ticket issuance and atomic second-leg rollback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_issue_verified_demand_hold_tickets_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_issue_verified_demand_hold_tickets_v1(',start)
          source=s[start:end]
          assert len(source)>10000
          assert source.index('FOR UPDATE')<source.index('SECTION9_PARTIALLY_ISSUED_CONNECTING_JOURNEY')
          assert "MESSAGE='SECTION9_ATOMIC_DEMAND_TICKET_ISSUANCE_INCOMPLETE'" in source
          Path('/tmp/section9-connecting-tickets-actual.sql').write_text(source)
          print('Unchanged production worker extracted; tested review-only candidate is checked into supabase/migration_candidates')
          PY
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_connecting_ticket_acceptance.sql
      - name: Verify unchanged automatic-demand conversion worker on two-leg reservations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_promote_completed_demand_holds_batch_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_promote_completed_demand_holds_batch_v1(',start)
          source=s[start:end]
          assert len(source)>4000 and len(source)<10000
          assert 'pg_try_advisory_xact_lock(583729,10029)' in source
          assert 'SECTION9_UNSAFE_DEMAND_TICKET_CONVERSION_RESPONSE' in source
          assert 'section9_issue_verified_demand_hold_tickets_v1' in source
          Path('/tmp/section9-demand-worker-actual.sql').write_text(source)
          print('Unchanged original automatic demand conversion worker extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_automatic_demand_worker_acceptance.sql
      - name: Confirm overlapping automatic-demand workers cannot duplicate itinerary tickets
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_automatic_demand_worker_concurrency.sh
      - name: Race two direct issuers of one two-leg connecting itinerary
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_concurrent_connecting_issuers.sh
      - name: Race different two-leg itineraries against shared capacity
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_overlapping_itinerary_issuers.sh
      - name: Verify posted-flight ledger attribution detects bad amount and ownership
        run: |
          set -euo pipefail
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_posted_ledger_attribution_acceptance.sql
      - name: Test idempotent passenger recovery receipt with no financial postings
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_recovery_entitlement_journal.sql
      - name: Test original private connecting-passenger recovery guards and receipt replay
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_original_connection_recovery_acceptance.sql
      - name: Verify private recovery and cancellation share disruption mutex
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_original_recovery_disruption_mutex.sh
      - name: Exercise unchanged recovery writer actual rebooking and rollback
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_original_recovery_rebooking_acceptance.sql
      - name: Race existing connecting recovery against reviewed ticket issuance in both orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_recovery_vs_ticket_issuance_race.sh
      - name: Verify original cancellation refuses operated and financially exposed flights
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_cancellation_finance_guards.sql
      - name: Race original cancellation against finance-preparation row locking in both orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_finance_preparation_vs_cancellation_race.sh
      - name: Verify original completed-flight finance writer fail-closed and private execution
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_original_final_finance_guards.sql
      - name: Verify final flight-finance writer refuses concurrent same-flight posting
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_original_final_finance_mutex.sh
      - name: Prove original completed-flight settlement actual ledger cash and receipt atomicity
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_final_finance_atomic_acceptance.sql
      - name: Race original final settlement with original cancellation on closed flights
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_real_final_post_vs_cancellation_race.sh
      - name: Reproduce signed-movement cancellation stale-read gap and proposed row-lock ordering
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_movement_vs_cancellation_gap.sh
      - name: Compile original signed movement writer and validate guarded row-lock candidate
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_signed_movement_patch_compile_acceptance.sql
      - name: Verify real signed movement HMAC authorization and disabled operational release
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_signed_movement_hmac_acceptance.sql
      - name: Execute original patched signed departure arrival and replay with synthetic evidence
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_real_signed_departure_arrival_acceptance.sql
      - name: Race actual signed departure against actual cancellation in both occurrence lock orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_real_signed_departure_vs_cancellation_race.sh
      - name: Verify movement patch rejects source drift and duplicate application
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_signed_movement_source_drift_guard.sh
      - name: Race maintenance-held aircraft lock against signed departure and cancellation
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_fleet_lock_vs_signed_movement_cancellation.sh
      - name: Race fuel custody preflight lock with signed movement and cancellation in both orders
        run: |
          set -euo pipefail
          bash tests/sql/section9_disposable_fuel_custody_vs_signed_movement_cancellation.sh
      - name: Verify isolated acceptance remained on disposable Postgres
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN current_database()='airlinerra_disposable' AND (SELECT count(*) FROM airlinerra_game.airline_flight_schedule_drafts_v1 WHERE status='active' AND operationally_verified AND id IN ('44444444-4444-4444-8444-444444444444'::uuid,'55555555-5555-4555-8555-555555555555'::uuid))=2 THEN 'PASS-isolated-pair' ELSE 'FAIL-isolated-pair' END;" | grep -x 'PASS-isolated-pair'
      - name: Summary of isolation
        if: always()
        run: |
          echo '### FRA-MUC positive atomic activation on disposable PostgreSQL 17' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real pair-activation SQL used unchanged. Aircraft, 10 signed certification records, slot windows and ticket gateway are synthetic fixtures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production schema, player aircraft, airline balances, real licences, signed source certifications, bookings, or flight movements changed.' >> "$GITHUB_STEP_SUMMARY"

# Verification only: disposable localhost database; no live flight actions.
