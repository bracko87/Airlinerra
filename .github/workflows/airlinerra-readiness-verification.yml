name: Airlinerra frontend readiness verification

on:
  push:
    branches:
      - phase-14h-crew-integration
    paths:
      - 'website/**'
      - 'server/**'
      - 'tests/**'
      - '.github/workflows/airlinerra-readiness-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout development source
        uses: actions/checkout@v5
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install pinned website dependencies
        run: npm ci
      - name: Run readiness API and frontend regression tests
        run: npm run test:route-readiness
      - name: Run website regression tests
        run: npm test
      - name: Verify production-style static build
        run: npm run build
      - name: Verify compiled readiness modules
        run: |
          test -f ../dist/section9-route-details.mjs
          test -f ../dist/section9-certification-records.mjs
          test -f ../dist/section9-operational-evidence.mjs

  disposable-pair-activation:
    name: Disposable PostgreSQL 17 certified round-trip acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=30000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v5
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify fresh disposable Postgres before DDL
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGPORT" = '5432'
          test "$PGUSER" = 'postgres'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
      - name: Bootstrap controlled FRA-MUC reciprocal route, certification and inventory fixtures
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql
      - name: Extract and install unchanged production roundtrip activation SQL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261117130000_section9_atomic_certified_pair_ticket_activation_v1.sql').read_text()
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.section9_commit_certified_pair_and_ticket_inventory_v1(',start)
          source=s[start:end]
          assert 'END $function$' in source
          assert 'SECTION9_PAIR_TICKET_INVENTORY_FAILED_FULL_ROLLBACK' in source
          Path('/tmp/section9-pair-actual.sql').write_text(source)
          print('Unchanged production pair-activation function extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/section9-pair-actual.sql
      - name: Test positive dual-leg activation, three atomic rollbacks, capacity and replay
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_acceptance.sql
      - name: Exercise isolated cancellation transaction rollback and replay lab
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_cancellation_transaction_lab.sql
      - name: Verify isolated acceptance remained on disposable Postgres
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN current_database()='airlinerra_disposable' AND (SELECT count(*) FROM airlinerra_game.airline_flight_schedule_drafts_v1 WHERE status='active' AND operationally_verified)=2 THEN 'PASS-isolated-pair' ELSE 'FAIL-isolated-pair' END;" | grep -x 'PASS-isolated-pair'
      - name: Summary of isolation
        if: always()
        run: |
          echo '### FRA-MUC positive atomic activation on disposable PostgreSQL 17' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real pair-activation SQL used unchanged. Aircraft, 10 signed certification records, slot windows and ticket gateway are synthetic fixtures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production schema, player aircraft, airline balances, real licences, signed source certifications, bookings, or flight movements changed.' >> "$GITHUB_STEP_SUMMARY"

# Verification only: disposable localhost database; no live flight actions.
