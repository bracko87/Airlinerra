name: Brazil ANAC 2025 source reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official ANAC CSV with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anac"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 6 --connect-timeout 25 --max-time 900 \
            'https://sistemas.anac.gov.br/dadosabertos/Voos%20e%20opera%C3%A7%C3%B5es%20a%C3%A9reas/Dados%20Estat%C3%ADsticos%20do%20Transporte%20A%C3%A9reo/Dados_Estatisticos.csv' \
            -o "$RUNNER_TEMP/anac/Dados_Estatisticos.csv"
          test "$(stat -c%s "$RUNNER_TEMP/anac/Dados_Estatisticos.csv")" -gt 100000000
          sha256sum "$RUNNER_TEMP/anac/Dados_Estatisticos.csv" | tee "$RUNNER_TEMP/anac/source_sha256.txt"
      - name: Run importer smoke test and full review
        shell: bash
        run: |
          set -euo pipefail
          python scripts/reconcile_brazil_anac_2025.py --smoke-test
          python scripts/reconcile_brazil_anac_2025.py \
            --anac-csv "$RUNNER_TEMP/anac/Dados_Estatisticos.csv" \
            --output "$RUNNER_TEMP/anac/group46_brazil_anac_2025_official_crosswalk.csv"
      - name: Verify review coverage and unique source IDs
        shell: bash
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'anac/group46_brazil_anac_2025_official_crosswalk.csv'
          with p.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          ids=[r['source_airport_id'] for r in rows]
          assert len(rows)==577, f'Expected 577 Brazil airports, got {len(rows)}'
          assert len(set(ids))==577, 'Duplicate Brazil source IDs'
          matched=sum(int(r['matched_flight_stage_rows'])>0 for r in rows)
          print(f'Rows: {len(rows)}; airports with matched 2025 ANAC stages: {matched}')
          assert matched>=20, 'Unexpectedly few matches; review data schema and source'
          PY
      - name: Upload review only (no game-data changes)
        uses: actions/upload-artifact@v4
        with:
          name: brazil-anac-2025-official-review
          path: |
            ${{ runner.temp }}/anac/group46_brazil_anac_2025_official_crosswalk.csv
            ${{ runner.temp }}/anac/source_sha256.txt
          retention-days: 30
