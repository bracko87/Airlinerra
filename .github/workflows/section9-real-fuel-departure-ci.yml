name: Real signed departure and fuel receipts (disposable)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_fuel_departure_disposable_dependencies.sql'
      - 'tests/sql/section9_real_signed_movement_disposable_dependencies.sql'
      - 'tests/sql/section9_real_cancellation_disposable_bootstrap.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - '.github/workflows/section9-real-fuel-departure-ci.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/sql/section9_real_fuel_departure_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - '.github/workflows/section9-real-fuel-departure-ci.yml'
permissions:
  contents: read
jobs:
  real-fuel-departure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Verify isolated database, create minimal dependency stack
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = airlinerra_disposable
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_signed_movement_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_fuel_departure_disposable_dependencies.sql
      - name: Extract exact fuel preflight and fuel receipt production SQL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql').read_text()
          fragments=[]
          for name in ('section9_verify_game_fuel_before_departure_v1','section9_capture_verified_departure_fuel_v1'):
            a=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
            b=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',a)
            fragment=src[a:b]
            assert 'END $function$' in fragment
            fragments.append(fragment)
          Path('/tmp/real-fuel-functions.sql').write_text('\n'.join(fragments))
          print('Exact production fuel preflight and departure receipt function sources extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/real-fuel-functions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
      - name: Verify actual fuel preflight and signed fuel receipt atomically
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_verify_game_fuel_before_departure_v1('$FID')->>'status'" | grep -qx verified_game_fuel_onboard_available_for_planned_trip
          psql -XAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT airlinerra_game.section9_record_signed_operated_flight_movement_v1('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1,'2026-11-23',4,'departed','2026-11-23 18:00+00','TEST-REAL-FUEL-EVENT-04',airlinerra_game.test_sign_event('TEST-REAL-FUEL-EVENT-04','2026-11-23 18:00+00',4))->>'status'; SELECT airlinerra_game.section9_capture_verified_departure_fuel_v1('$FID','TEST-REAL-FUEL-EVENT-04')->>'status'; UPDATE airlinerra_game.section9_dated_flight_occurrences_v1 SET booking_status='closed' WHERE weekly_entry=4 AND booking_status='open'; COMMIT;" | grep -E '^(operated_flight_departure_recorded|signed_game_fuel_departure_receipt_created|closed)$' > "$RUNNER_TEMP/fuel-positive.txt"
          grep -qx operated_flight_departure_recorded "$RUNNER_TEMP/fuel-positive.txt"
          grep -qx signed_game_fuel_departure_receipt_created "$RUNNER_TEMP/fuel-positive.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '1:1:closed'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_capture_verified_departure_fuel_v1('$FID','TEST-REAL-FUEL-EVENT-04')->>'status'" | grep -qx game_fuel_departure_already_proven
      - name: Insufficient fuel forces atomic signed movement rollback
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:5'
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_current_position_v1 SET location_status='grounded',airport_key='TEST-AAA',current_flight_occurrence_id=NULL,last_event_utc=NULL,last_departure_utc=NULL"
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET onboard_kg=100; UPDATE airlinerra_game.section9_game_approved_fuel_load_receipts_v1 SET fuel_after_load_kg=100"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_verify_game_fuel_before_departure_v1('$FID')->>'status'" | grep -qx blocked_insufficient_aircraft_fuel_including_reserve
          if psql -XAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT airlinerra_game.section9_record_signed_operated_flight_movement_v1('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1,'2026-11-23',5,'departed','2026-11-23 18:00+00','TEST-REAL-FUEL-EVENT-05',airlinerra_game.test_sign_event('TEST-REAL-FUEL-EVENT-05','2026-11-23 18:00+00',5))->>'status'; DO \$\$ DECLARE result jsonb; BEGIN result:=airlinerra_game.section9_capture_verified_departure_fuel_v1('$FID','TEST-REAL-FUEL-EVENT-05'); IF result->>'status'<>'signed_game_fuel_departure_receipt_created' THEN RAISE EXCEPTION 'SECTION9_UNVERIFIED_DEPARTURE_FUEL_ROLLS_BACK_MOVEMENT'; END IF; END \$\$; COMMIT;" > "$RUNNER_TEMP/fuel-rejected.txt" 2>&1; then
            echo 'CRITICAL: invalid fuel proof allowed movement transaction'; exit 1
          fi
          grep -q SECTION9_UNVERIFIED_DEPARTURE_FUEL_ROLLS_BACK_MOVEMENT "$RUNNER_TEMP/fuel-rejected.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=5)" | grep -qx '0:0:open'
      - name: Report scope and provenance
        if: always()
        run: |
          echo '### Exact real fuel preflight, receipt, signed writer: isolated PostgreSQL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual fuel preflight and receipt from production migration, guarded real HMAC signed movement writer, synthetic quote/clock/aircraft dependencies. Positive/replay and insufficient-fuel rollback tested.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not execute the full operational dispatcher, auto-fuel supplier, actual fuel consumption at arrival, finance settlement or live production.' >> "$GITHUB_STEP_SUMMARY"
