name: Airlinerra cabin layouts and MRO directory (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'website/cabin-configuration-manager.mjs'
      - 'website/aircraft-configuration-options.mjs'
      - 'website/aircraft-configuration-dialog.mjs'
      - 'website/airline-workspace.mjs'
      - 'website/fleet-acquisition-client.mjs'
      - 'website/local-owner-fleet-reader.mjs'
      - 'website/private-player-app.html'
      - 'website/player-app-model.mjs'
      - 'website/dev-scripts/invited-overlay.mjs'
      - 'website/dev-scripts/real-player-read-gateway.mjs'
      - 'server/fleet-acquisition-service.mjs'
      - 'server/cabin-refit-readiness.mjs'
      - 'server/section9-demand-allocation.mjs'
      - 'server/section9-network-demand-engine.mjs'
      - 'tests/test_section9_demand_allocation.mjs'
      - 'tests/test_section9_network_engine.mjs'
      - 'tests/test_cabin_refit_readiness.mjs'
      - 'tests/test_cabin_configuration.mjs'
      - 'tests/test_aircraft_configuration_modal.mjs'
      - 'tests/test_airline_workspace.mjs'
      - 'tests/test_fleet_acquisition_api.mjs'
      - 'tests/test_local_owner_fleet_reader.mjs'
      - 'supabase/migrations/*cabin*'
      - 'supabase/migrations/*mro*'
      - 'supabase/migrations/*refit*'
      - '.github/workflows/airlinerra-cabin-layout-mro-ci.yml'
  workflow_dispatch:
jobs:
  cabin-mro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser and owner API syntax
        run: |
          node --check website/cabin-configuration-manager.mjs
          node --check website/airline-workspace.mjs
          node --check website/fleet-acquisition-client.mjs
          node --check website/local-owner-fleet-reader.mjs
          node --check website/dev-scripts/real-player-read-gateway.mjs
          node --check server/fleet-acquisition-service.mjs
      - name: Test aircraft configuration, server ownership, and existing navigation
        run: node --test tests/test_cabin_configuration.mjs tests/test_aircraft_configuration_modal.mjs tests/test_fleet_acquisition_api.mjs tests/test_airline_workspace.mjs tests/test_local_owner_fleet_reader.mjs
      - name: Verify passenger-only installed cabin demand with no draft or cargo effect
        run: node --test tests/test_section9_demand_allocation.mjs tests/test_section9_network_engine.mjs
      - name: Verify dormant cabin refit gates (no charges or installation)
        run: node --test tests/test_cabin_refit_readiness.mjs
      - name: Verify full built invitation-only website
        run: |
          cd website
          npm run build
