name: Real cancellation function vs fuel custody dispatch (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_cancellation_disposable_bootstrap.sql'
      - 'server/sql/section9_disruption_decision_and_cancellation.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - '.github/workflows/section9-real-cancellation-disposable-ci.yml'
  pull_request:
    paths:
      - 'tests/sql/section9_real_cancellation_disposable_bootstrap.sql'
      - 'server/sql/section9_disruption_decision_and_cancellation.sql'
      - '.github/workflows/section9-real-cancellation-disposable-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Check isolation and bootstrap synthetic dependencies
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = airlinerra_disposable
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
      - name: Extract and install UNMODIFIED production cancellation function
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server/sql/section9_disruption_decision_and_cancellation.sql').read_text()
          name='section9_cancel_unflown_occurrence_v1'
          start=s.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
          end=s.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
          body=s[start:end]
          assert 'FOR UPDATE' in body and 'pg_advisory_xact_lock(583729,10041)' in body
          assert "SET booking_status='cancelled'" in body
          Path('/tmp/airlinerra-unmodified-cancellation.sql').write_text(body)
          print('Production cancellation function extracted without modification')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/airlinerra-unmodified-cancellation.sql
      - name: Real cancellation rejects existing signed-movement evidence
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO airlinerra_game.section9_operated_flight_movements_v1 VALUES ('11111111-1111-4111-8111-111111111111:2026-11-23:1','departed','TEST-ALREADY-MOVED')"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000001','maximum_delay_exceeded')->>'status'" | grep -qx 'flight_already_operated_or_settled'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=1" | grep -qx open
      - name: Actual cancellation wins, replay remains once-only, model dispatch rolls back
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000002','maximum_delay_exceeded')->>'status'" | grep -qx flight_cancelled
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000002','maximum_delay_exceeded')->>'replayed')" | grep -qx true
          if psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.test_model_signed_dispatch('00000000-0000-4000-8000-000000000002')" > /tmp/invalid-dispatch.txt 2>&1; then
            echo 'Cancelled flight model dispatch unexpectedly succeeded'; exit 1
          fi
          grep -q SECTION9_DEPARTURE_BOOKING_CLOSE_UNCONFIRMED_ROLLBACK /tmp/invalid-dispatch.txt
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT o.booking_status||':'||o.booked_seats||':'||c.passengers_held||':'||(SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id=c.physical_flight_id)||':'||(SELECT count(*) FROM airlinerra_game.section9_flight_cancellation_receipts_v1 WHERE occurrence_id=o.id) FROM airlinerra_game.section9_dated_flight_occurrences_v1 o JOIN airlinerra_game.section9_occurrence_capacity_inventory_v1 c ON c.physical_flight_id=o.schedule_id::text||':'||o.flight_local_date::text||':'||o.weekly_entry::text WHERE o.weekly_entry=2" | grep -qx 'cancelled:0:0:0:1'
      - name: Fuel custody held, model departure wins, real cancellation loses
        shell: bash
        run: |
          set -euo pipefail
          psql -XqAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT onboard_kg FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1 FOR UPDATE; SELECT pg_sleep(3); COMMIT;" > "$RUNNER_TEMP/custody-holder.txt" 2>&1 &
          holder=$!
          sleep 0.3
          psql -XqAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.test_model_signed_dispatch('00000000-0000-4000-8000-000000000003')" > "$RUNNER_TEMP/model-departure.txt" 2>&1 &
          dispatcher=$!
          seen=0
          for n in $(seq 1 20); do
            blocked=$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_stat_activity WHERE wait_event_type='Lock' AND query LIKE 'SELECT airlinerra_game.test_model_signed_dispatch(%';")
            if [ "$blocked" -gt 0 ]; then seen=1; break; fi
            sleep 0.1
          done
          test "$seen" -eq 1
          psql -XqAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000003','maximum_delay_exceeded')->>'status'" > "$RUNNER_TEMP/real-cancellation-loses.txt" 2>&1 &
          canceller=$!
          wait "$holder"; wait "$dispatcher"; wait "$canceller"
          grep -qx departed "$RUNNER_TEMP/model-departure.txt"
          grep -qx flight_not_cancellable "$RUNNER_TEMP/real-cancellation-loses.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT booking_status||':'||(SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id=o.schedule_id::text||':'||o.flight_local_date::text||':'||o.weekly_entry::text)||':'||(SELECT count(*) FROM airlinerra_game.section9_flight_cancellation_receipts_v1 WHERE occurrence_id=o.id) FROM airlinerra_game.section9_dated_flight_occurrences_v1 o WHERE weekly_entry=3" | grep -qx 'closed:1:0'
      - name: Declare scope
        if: always()
        run: |
          echo '### Unmodified production cancellation function in disposable PostgreSQL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Runs actual cancellation SQL against synthetic minimal tables with a model dispatcher sharing the production advisory lock. Covers both outcomes, evidence guard, once-only receipt, and rollback.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does NOT execute real HMAC signed-movement writer or live fuel-quantity/receipt functions; does NOT touch production.' >> "$GITHUB_STEP_SUMMARY"
