name: Airlinerra staged Netlify Function bundle (non-deploying)

# Source-only dry-run with the real Netlify CLI. This does NOT connect a
# Netlify site, deploy functions, publish a preview or read any secrets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/airlinerra-netlify-function-bundle-ci.yml'
      - 'server/**'
      - 'website/package.json'
      - 'website/package-lock.json'
      - 'website/server-only-pg-loader.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airlinerra-netlify-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: 'true'
      NETLIFY_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout without deployment credentials
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exact server dependency tree
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check production prelaunch isolation
        run: |
          set -euo pipefail
          test -f website/netlify/functions/airlinerra-game.mjs
          test ! -d netlify/functions
          grep -Fq 'EDGE_FUNCTION_URL' server/production-game-api.mjs
          grep -Fq 'directory = "netlify/functions"' netlify.toml
          test ! -e .netlify/state.json
          grep -Eq '^export const PUBLIC_AUTH_ENABLED = false;' website/auth-rules.mjs
          # The owner explicitly requested a single manual deployment with
          # this real function. Missing private environment values must fail closed.
          ! grep -Eq 'AIRLINERRA_DATABASE_URL|loadPg' server/production-game-api.mjs
      - name: Verify actual production Netlify game Function bundles without deployment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NETLIFY_AUTH_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/airlinerra-production-functions"
          npm exec --yes --package=netlify-cli@27.14.2 -- \
            netlify functions:build \
            --src "$GITHUB_WORKSPACE/website/netlify/functions" \
            --functions "$RUNNER_TEMP/airlinerra-production-functions"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          folder=Path(os.environ['RUNNER_TEMP'])/'airlinerra-production-functions'
          archives=list(folder.rglob('airlinerra-game.zip'))
          assert len(archives)==1, 'Missing actual Airlinerra game API Function bundle'
          with ZipFile(archives[0]) as f:
            names=f.namelist()
            assert names and any('airlinerra-game' in n for n in names), names[:10]
            assert not any('AIRLINERRA_DATABASE_URL' in n for n in names), 'Never bundle secrets'
          print('PASS: Active Airlinerra production API bundles in isolation')
          PY
      - name: Prebundle account backend from the pinned website dependency tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NETLIFY_AUTH_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/airlinerra-source"
          npm exec --yes --package=esbuild@0.25.12 -- \
            esbuild "$GITHUB_WORKSPACE/server/netlify-preview-template/airlinerra-accounts.mjs" \
            --bundle --platform=node --format=esm --target=node22 \
            --external:pg-native \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --outfile="$RUNNER_TEMP/airlinerra-source/airlinerra-accounts.mjs"
          test -s "$RUNNER_TEMP/airlinerra-source/airlinerra-accounts.mjs"
          echo 'Private function prebundled in CI only; no production directory created.'
      - name: Compile staged serverless Function into ephemeral CI directory
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NETLIFY_AUTH_TOKEN:-}"
          mkdir -p "$RUNNER_TEMP/airlinerra-functions"
          npm exec --yes --package=netlify-cli@27.14.2 -- \
            netlify functions:build \
            --src "$RUNNER_TEMP/airlinerra-source" \
            --functions "$RUNNER_TEMP/airlinerra-functions"
          ls -lah "$RUNNER_TEMP/airlinerra-functions"
      - name: Assert isolated Function contains compiled Netlify adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          output=Path(os.environ['RUNNER_TEMP'])/'airlinerra-functions'
          files=[p for p in output.rglob('*') if p.is_file()]
          assert files, 'Netlify CLI emitted no function artifact'
          print('Isolated output:', ', '.join(f'{p.name}: {p.stat().st_size} bytes' for p in files))
          assert any('airlinerra' in p.name for p in files)
          from zipfile import ZipFile
          packages=[p for p in files if p.name=='airlinerra-accounts.zip']
          assert len(packages)==1, 'Expected exactly one staged Netlify Function bundle'
          with ZipFile(packages[0]) as archive:
            members=archive.namelist()
            print('NETLIFY_BUNDLE_ENTRIES:', ', '.join(members[:80]))
            print('NETLIFY_BUNDLE_FILE_COUNT:', len(members))
            print('PG_MODULE_MEMBERS:', ', '.join(n for n in members if 'pg' in n.lower())[:900])
            assert members, 'Empty Functions ZIP'
          assert (Path('website')/'netlify'/'functions'/'airlinerra-game.mjs').is_file()
          assert not (Path('netlify')/'functions').exists()
          PY
      - name: Smoke test bundled Function with synthetic preview config and no network
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          zip_path=Path(os.environ['RUNNER_TEMP'])/'airlinerra-functions'/'airlinerra-accounts.zip'
          output=Path(os.environ['RUNNER_TEMP'])/'unpacked-netlify-function'
          output.mkdir()
          with ZipFile(zip_path) as archive:
            names=archive.namelist()
            assert all('..' not in Path(n).parts and not Path(n).is_absolute() for n in names)
            archive.extractall(output)
          entry=output/'airlinerra-accounts.mjs'
          assert entry.is_file()
          print('BUNDLED_ENTRY_SIZE:', entry.stat().st_size)
          PY
          node --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          import assert from 'node:assert/strict';
          const entry=pathToFileURL(join(process.env.RUNNER_TEMP,
            'unpacked-netlify-function','airlinerra-accounts.mjs')).href;
          const {default:handler,config}=await import(entry);
          assert.equal(typeof handler,'function');
          assert.deepEqual(config.path,[
            '/api/v1/onboarding/context','/api/v1/legal/consents','/api/v1/airlines'
          ]);
          assert.deepEqual(config.rateLimit,{
            action:'rate_limit',aggregateBy:'ip',windowSize:60,windowLimit:30
          });
          const origin='https://deploy-preview-123--airlinerra.netlify.app';
          const trustedSite={name:'airlinerra',url:'https://airlinerra.com'};
          const productionContext={deploy:{context:'production',published:true},site:trustedSite};
          const previewContext={deploy:{context:'deploy-preview',published:false},site:trustedSite};
          const secret='B'.repeat(43); // Synthetic, never a real credential.
          const request=()=>new Request(origin+'/api/v1/onboarding/context',{
            method:'POST',
            headers:{
              origin,'content-type':'application/json',
              'x-airlinerra-preview-access':secret,
              authorization:'Bearer bad'
            },
            body:'{}'
          });
          const oldFetch=globalThis.fetch;
          // Mock ONLY publicly readable Auth policy, never external network.
          globalThis.fetch=async(url)=>{
            if(url==='https://hwllkabgzaynalahvkpz.supabase.co/auth/v1/settings'){
              return new Response(JSON.stringify({
                disable_signup:true,mailer_autoconfirm:false,
                external:{email:true,anonymous_users:false}
              }),{status:200,headers:{'content-type':'application/json'}});
            }
            throw Error('SECURITY: Unexpected network call');
          };
          try{
            const closed=await handler(request());
            assert.equal(closed.status,503);
            Object.assign(process.env,{
              CONTEXT:'deploy-preview', // Intentionally misleading; runtime MUST ignore it.
              AIRLINERRA_HOSTED_BACKEND_ENABLED:'true',
              AIRLINERRA_PRIVATE_PREVIEW_APPROVED:'true'
            });
            assert.equal((await handler(request(),productionContext)).status,503);
            Object.assign(process.env,{
              CONTEXT:'production', // Build-only metadata is not authoritative.
              AIRLINERRA_PREVIEW_ORIGIN:origin,
              AIRLINERRA_PREVIEW_ACCESS_SECRET:secret,
              AIRLINERRA_SUPABASE_URL:'https://hwllkabgzaynalahvkpz.supabase.co',
              AIRLINERRA_SUPABASE_PUBLISHABLE_KEY:'sb_publishable_'+('A'.repeat(32)),
              AIRLINERRA_PRIVATE_DATABASE_URL:'postgresql://postgres.hwllkabgzaynalahvkpz:synthetic-ci-only@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require',
              AIRLINERRA_TERMS_PATH:'/legal/terms-v1.html',
              AIRLINERRA_PRIVACY_PATH:'/legal/privacy-v1.html'
            });
            const badSession=await handler(request(),previewContext);
            assert.equal(badSession.status,401,
              'Bundled pg driver and private handlers must load and reject invalid Auth without network');
            assert.equal(badSession.headers.get('cache-control'),'no-store');
            // Official domain is used as a controlled prelaunch test site.
            // Preview access flags must NEVER open a production deployment.
            const canonicalOrigin='https://airlinerra.com';
            const canonicalSecret='C'.repeat(43);
            const canonicalRequest=()=>new Request(canonicalOrigin+'/api/v1/onboarding/context',{
              method:'POST',
              headers:{
                origin:canonicalOrigin,'content-type':'application/json',
                'x-airlinerra-preview-access':canonicalSecret,
                authorization:'Bearer bad'
              },
              body:'{}'
            });
            assert.equal((await handler(canonicalRequest(),productionContext)).status,503);
            Object.assign(process.env,{
              AIRLINERRA_HOSTED_RUNTIME_MODE:'canonical-prelaunch-test',
              AIRLINERRA_CANONICAL_PRELAUNCH_TEST_APPROVED:'true',
              AIRLINERRA_CANONICAL_TEST_ORIGIN:canonicalOrigin,
              AIRLINERRA_CANONICAL_TEST_ACCESS_SECRET:canonicalSecret,
              CONTEXT:'deploy-preview' // Must not override trusted production context.
            });
            const canonicalTest=await handler(canonicalRequest(),productionContext);
            assert.equal(canonicalTest.status,401,
              'Operator-approved official-domain Function must reject invalid token offline');
            assert.equal(canonicalTest.headers.get('cache-control'),'no-store');
            assert.equal((await handler(request(),previewContext)).status,503,
              'Canonical mode must not authorize a separate deploy preview');
            console.log('PASS: Netlify ZIP denies unauthorised production, verifies both isolated modes, rejects invalid tokens offline');
          }finally{
            globalThis.fetch=oldFetch;
          }
          JS
      - name: Archive the verified Function for a future owner-approved preview
        uses: actions/upload-artifact@v4
        with:
          name: airlinerra-private-account-function-build
          path: |
            ${{ runner.temp }}/airlinerra-functions/airlinerra-accounts.zip
            ${{ runner.temp }}/airlinerra-functions/manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Recheck public static build remains unrelated
        working-directory: website
        run: |
          npm run build
          test -f ../dist/index.html
          test ! -e ../dist/server
          test ! -e ../dist/node_modules
          test ! -e ../dist/package.json
