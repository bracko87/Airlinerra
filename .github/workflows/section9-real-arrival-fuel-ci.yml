name: Actual signed arrival airframe and fuel burn (disposable)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_arrival_disposable_dependencies.sql'
      - 'tests/sql/section9_bookings_into_real_arrival_dependencies.sql'
      - 'tests/sql/section9_bookings_before_signed_departure_acceptance.sql'
      - 'tests/sql/section9_bookings_after_signed_departure_acceptance.sql'
      - 'tests/sql/section9_bookings_after_signed_arrival_acceptance.sql'
      - 'supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql'
      - 'supabase/migrations/20261113223000_section9_hour_accurate_tickets_and_movement_enforcement_v1.sql'
      - 'tests/sql/section9_arrival_custody_conflict_disposable_setup.sql'
      - 'tests/sql/section9_real_dispatcher_disposable_dependencies.sql'
      - 'tests/sql/section9_real_fuel_departure_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'supabase/migrations/20261123210000_section9_dispatch_traffic_permission_binding_fix.sql'
      - 'supabase/migrations/20261113233000_section9_once_only_arrival_airframe_hours_cycles_v1.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - '.github/workflows/section9-real-arrival-fuel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-arrival:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Isolate database and install synthetic prerequisite records
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = airlinerra_disposable
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_signed_movement_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_fuel_departure_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_dispatcher_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_arrival_disposable_dependencies.sql
      - name: Install unchanged production arrival airframe and fuel burn functions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          sources=[
            ('supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql',[
              'section9_verify_game_fuel_before_departure_v1',
              'section9_capture_verified_departure_fuel_v1',
              'section9_apply_verified_arrival_fuel_burn_once_v1']),
            ('supabase/migrations/20261113233000_section9_once_only_arrival_airframe_hours_cycles_v1.sql',[
              'section9_apply_arrival_airframe_usage_once_v1'])]
          fragments=[]
          for path,names in sources:
            source=Path(path).read_text()
            for name in names:
              a=source.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
              b=source.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',a)
              fragment=source[a:b]
              assert 'END $function$' in fragment
              fragments.append(fragment)
          Path('/tmp/actual-arrival-functions.sql').write_text('\n'.join(fragments))
          print('Original production arrival burn, airframe usage, fuel departure functions extracted unchanged')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/actual-arrival-functions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123210000_section9_dispatch_traffic_permission_binding_fix.sql
      - name: Install unchanged genuine saleable-window and private game passenger booking SQL
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_bookings_into_real_arrival_dependencies.sql
          python3 - <<'PY'
          from pathlib import Path
          sources=[
            ('supabase/migrations/20261113223000_section9_hour_accurate_tickets_and_movement_enforcement_v1.sql',
             'section9_verified_saleable_departure_window_v1'),
            ('supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql',
             'section9_reserve_verified_game_passenger_seats_v1')
          ]
          parts=[]
          for path,name in sources:
            src=Path(path).read_text()
            first=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
            end=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',first)
            body=src[first:end]
            assert 'END $function        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'departuresRecorded'" | grep -qx 1
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1)::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '1:closed'
      - name: Confirm bookings closed by REAL signed departure and fuel custody receipt
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_bookings_after_signed_departure_acceptance.sql
      - name: Advance synthetic authoritative clock to signed arrival
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_verified_berlin_game_hour_v1() RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT jsonb_build_object('authoritativeGameHourAvailable',true,'gameHourUtc','2026-11-23 19:00:00+00') \$\$"
      - name: Actual dispatcher applies signed arrival fuel burn and airframe hours once
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/arrival-first.txt"
          cat "$RUNNER_TEMP/arrival-first.txt"
          grep -q '"arrivalsRecorded": 1' "$RUNNER_TEMP/arrival-first.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='arrived')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT (onboard_kg=380)::int||':'||revision::text||':'||at_airport_key FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT (tracked_flight_hours=1)::int||':'||tracked_flight_cycles::text FROM airlinerra_game.aircraft_maintenance_state_v1)" | grep -qx '1:1:1:1:2:TEST-BBB:1:1'
      - name: Confirm SAME booked flight completed signed arrival and actual fuel burn with no upfront revenue
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_bookings_after_signed_arrival_acceptance.sql
      - name: Replay of actual arrival dispatcher does not repeat fuel burn or cycles
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'arrivalsRecorded'" | grep -qx 0
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1)||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1)||':'||(SELECT (onboard_kg=380)::int||':'||revision::text FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT tracked_flight_cycles FROM airlinerra_game.aircraft_maintenance_state_v1)" | grep -qx '1:1:1:2:1'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_apply_verified_arrival_fuel_burn_once_v1('11111111-1111-4111-8111-111111111111:2026-11-23:4','TEST-AUTO-DISPATCH-ARRIVED-4')->>'status'" | grep -qx signed_game_fuel_burn_already_applied
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_apply_arrival_airframe_usage_once_v1('11111111-1111-4111-8111-111111111111:2026-11-23:4')->>'status'" | grep -qx airframe_usage_already_applied
      - name: Changed fuel custody in transit atomically rolls back signed arrival
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:5'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_arrival_custody_conflict_disposable_setup.sql
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'departuresRecorded'" | grep -qx 1
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=5)" | grep -qx '1:1:closed'
          # This fixture-only tamper changes the custody revision after departure.
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET revision=revision+1"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_verified_berlin_game_hour_v1() RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT jsonb_build_object('authoritativeGameHourAvailable',true,'gameHourUtc','2026-11-23 19:00:00+00') \$\$"
          if psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/rejected-arrival.txt" 2>&1; then
             echo 'CRITICAL: in-transit custody revision mismatch was accepted'; exit 1
          fi
          grep -q SECTION9_FLIGHT_FUEL_CUSTODY_CHANGED_IN_TRANSIT_ROLLBACK "$RUNNER_TEMP/rejected-arrival.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='arrived')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT tracked_flight_cycles FROM airlinerra_game.aircraft_maintenance_state_v1)||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=5)" | grep -qx '0:0:0:1:closed'
      - name: Report boundaries
        if: always()
        run: |
          echo '### Real automatic signed departure and arrival with unchanged airframe and fuel-burn SQL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verifies 500 to 380 kg, custody revision 1 to 2, 1 hour and 1 cycle, two once-only receipt kinds, and stable replay.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unmodified genuine game passenger writer (plus genuine 7-day time-window), signed automatic departure and arrival, fuel custody and aircraft usage now operate on ONE synthetic physical flight.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Release, permission, clock, aircraft position, synthetic prebooked 2 seats and fuel quote remain fixtures. No production/finance release. Actual postflight revenue settlement, real signed demand issuer and cancellations/refunds still not certified.' >> "$GITHUB_STEP_SUMMARY"
 in body and 'CREATE OR REPLACE FUNCTION' in body
            parts.append(body)
          Path('/tmp/real-same-flight-booking.sql').write_text('\n'.join(parts))
          print('Unmodified real 7-day saleable window and private game booking SQL extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/real-same-flight-booking.sql
      - name: Reserve real passenger seats BEFORE actual signed departure on same physical flight
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_bookings_before_signed_departure_acceptance.sql
          # Restore initial synthetic authoritative 18:00 UTC game clock for real dispatch.
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION airlinerra_game.section9_verified_berlin_game_hour_v1()
          RETURNS jsonb LANGUAGE sql STABLE AS $fn$
           SELECT jsonb_build_object('authoritativeGameHourAvailable',true,
             'gameHourUtc','2026-11-23 18:00:00+00')
          $fn$;
          SQL
      - name: Actual dispatcher signs and records genuine departure and fuel proof
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'departuresRecorded'" | grep -qx 1
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1)::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '1:closed'
      - name: Advance synthetic authoritative clock to signed arrival
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_verified_berlin_game_hour_v1() RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT jsonb_build_object('authoritativeGameHourAvailable',true,'gameHourUtc','2026-11-23 19:00:00+00') \$\$"
      - name: Actual dispatcher applies signed arrival fuel burn and airframe hours once
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/arrival-first.txt"
          cat "$RUNNER_TEMP/arrival-first.txt"
          grep -q '"arrivalsRecorded": 1' "$RUNNER_TEMP/arrival-first.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='arrived')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT (onboard_kg=380)::int||':'||revision::text||':'||at_airport_key FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT (tracked_flight_hours=1)::int||':'||tracked_flight_cycles::text FROM airlinerra_game.aircraft_maintenance_state_v1)" | grep -qx '1:1:1:1:2:TEST-BBB:1:1'
      - name: Replay of actual arrival dispatcher does not repeat fuel burn or cycles
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'arrivalsRecorded'" | grep -qx 0
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1)||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1)||':'||(SELECT (onboard_kg=380)::int||':'||revision::text FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT tracked_flight_cycles FROM airlinerra_game.aircraft_maintenance_state_v1)" | grep -qx '1:1:1:2:1'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_apply_verified_arrival_fuel_burn_once_v1('11111111-1111-4111-8111-111111111111:2026-11-23:4','TEST-AUTO-DISPATCH-ARRIVED-4')->>'status'" | grep -qx signed_game_fuel_burn_already_applied
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_apply_arrival_airframe_usage_once_v1('11111111-1111-4111-8111-111111111111:2026-11-23:4')->>'status'" | grep -qx airframe_usage_already_applied
      - name: Changed fuel custody in transit atomically rolls back signed arrival
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:5'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_arrival_custody_conflict_disposable_setup.sql
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)->>'departuresRecorded'" | grep -qx 1
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=5)" | grep -qx '1:1:closed'
          # This fixture-only tamper changes the custody revision after departure.
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET revision=revision+1"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_verified_berlin_game_hour_v1() RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT jsonb_build_object('authoritativeGameHourAvailable',true,'gameHourUtc','2026-11-23 19:00:00+00') \$\$"
          if psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/rejected-arrival.txt" 2>&1; then
             echo 'CRITICAL: in-transit custody revision mismatch was accepted'; exit 1
          fi
          grep -q SECTION9_FLIGHT_FUEL_CUSTODY_CHANGED_IN_TRANSIT_ROLLBACK "$RUNNER_TEMP/rejected-arrival.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='arrived')||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_arrival_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT count(*) FROM airlinerra_game.section9_arrived_aircraft_usage_receipts_v1 WHERE physical_flight_id='$FID')||':'||(SELECT tracked_flight_cycles FROM airlinerra_game.aircraft_maintenance_state_v1)||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=5)" | grep -qx '0:0:0:1:closed'
      - name: Report boundaries
        if: always()
        run: |
          echo '### Real automatic signed departure and arrival with unchanged airframe and fuel-burn SQL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verifies 500 to 380 kg, custody revision 1 to 2, 1 hour and 1 cycle, two once-only receipt kinds, and stable replay.' >> "$GITHUB_STEP_SUMMARY"
