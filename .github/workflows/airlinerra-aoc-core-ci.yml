name: Airlinerra AOC safety and renewal rules (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/section9-aoc-policy.mjs'
      - 'server/section9-aoc-read-service.mjs'
      - 'server/section9-permission-player-http.mjs'
      - 'website/game-permission-applications-client.mjs'
      - 'website/game-permission-applications-view.mjs'
      - 'website/player-app.css'
      - 'tests/test_section9_permission_player_api_ui.mjs'
      - 'tests/test_section9_aoc_licence_ui.mjs'
      - 'tests/test_section9_aoc_policy.mjs'
      - 'tests/test_section9_aoc_read_service.mjs'
      - 'docs/sql/AIRLINERRA_AOC_*.sql'
      - 'supabase/migrations/*aoc*'
      - '.github/workflows/airlinerra-aoc-core-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aoc-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure server decision rules and test syntax
        run: |
          node --check server/section9-aoc-policy.mjs
          node --check server/section9-aoc-read-service.mjs
          node --check server/section9-permission-player-http.mjs
          node --check website/game-permission-applications-client.mjs
          node --check website/game-permission-applications-view.mjs
          node --check tests/test_section9_aoc_policy.mjs
          node --check tests/test_section9_aoc_read_service.mjs
          node --check tests/test_section9_aoc_licence_ui.mjs
          node --check tests/test_section9_permission_player_api_ui.mjs
      - name: Prove AOC scoring and renewal rules without database writes
        run: node --test tests/test_section9_aoc_policy.mjs tests/test_section9_aoc_read_service.mjs tests/test_section9_aoc_licence_ui.mjs tests/test_section9_permission_player_api_ui.mjs
      - name: Build the protected player website
        run: |
          cd website
          npm run build
      - name: Confirm no unreleased AOC module is included in public browser bundle
        run: |
          if grep -R "section9-aoc-policy" website --include='*.mjs'; then
            echo "AOC server logic cannot be shipped as browser authority"
            exit 1
          fi
