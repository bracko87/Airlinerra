name: Airlinerra Cargo Licence 3 (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/section9-permission-player-http.mjs'
      - 'website/game-permission-applications-client.mjs'
      - 'website/game-permission-applications-view.mjs'
      - 'website/licensing-planner.mjs'
      - 'supabase/migrations/*licence3*'
      - 'tests/test_licence3_cargo_fullflow.mjs'
      - '.github/workflows/airlinerra-licence3-cargo-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-licence3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check cargo source syntax
        run: |
          node --check server/section9-permission-player-http.mjs
          node --check website/game-permission-applications-client.mjs
          node --check website/game-permission-applications-view.mjs
          node --check tests/test_licence3_cargo_fullflow.mjs
      - name: Verify Cargo Licence 3 authentication and safety contracts
        run: node --test tests/test_licence3_cargo_fullflow.mjs
      - name: Build player website
        run: |
          cd website
          npm run build
