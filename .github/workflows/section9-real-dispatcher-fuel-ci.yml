name: Legacy dispatch fuel baseline with current signed movement (disposable)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_dispatcher_disposable_dependencies.sql'
      - 'tests/sql/section9_real_fuel_departure_disposable_dependencies.sql'
      - 'tests/sql/section9_real_signed_movement_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'tests/sql/section9_current_live_signed_movement_source_20261124.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - 'supabase/migrations/20261123210000_section9_dispatch_traffic_permission_binding_fix.sql'
      - '.github/workflows/section9-real-dispatcher-fuel-ci.yml'
  pull_request:
    paths:
      - 'tests/sql/section9_real_dispatcher_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'tests/sql/section9_current_live_signed_movement_source_20261124.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - 'supabase/migrations/20261123210000_section9_dispatch_traffic_permission_binding_fix.sql'
      - '.github/workflows/section9-real-dispatcher-fuel-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-dispatcher:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Verify isolated Postgres and create certified synthetic game inputs
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "airlinerra_disposable"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_signed_movement_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_fuel_departure_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_dispatcher_disposable_dependencies.sql
      - name: Install exact original fuel, receipt and actual automatic dispatcher SQL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql').read_text()
          names=['section9_verify_game_fuel_before_departure_v1',
                 'section9_capture_verified_departure_fuel_v1',
                 'section9_auto_dispatch_due_flight_events_v1']
          out=[]
          for name in names:
            a=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
            b=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',a)
            fragment=src[a:b]
            # The historic baseline used a PL/pgSQL local named exactly like
            # application.permission_code. The deployed current dispatcher
            # ALREADY replaced this with canonical AOC and Licence1/2.
            # Repair ambiguity ONLY IN THIS DISPOSABLE LEGACY FIXTURE.
            if name=='section9_auto_dispatch_due_flight_events_v1':
              for old,new in (
                (' permission_code text;',' required_permission_code text;'),
                ('permission_code:=airlinerra_game.section9_required_game_traffic_permission_v1',
                 'required_permission_code:=airlinerra_game.section9_required_game_traffic_permission_v1'),
                ('IF permission_code IS NULL','IF required_permission_code IS NULL'),
                ('a.permission_code=permission_code','a.permission_code=required_permission_code'),
              ):
                assert old in fragment, old
                fragment=fragment.replace(old,new)
            assert 'END $function$' in fragment, name
            out.append(fragment)
          Path('/tmp/real-dispatcher-functions.sql').write_text('\n'.join(out))
          print('Unmodified real fuel functions and explicitly repaired LEGACY dispatcher fixture extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/real-dispatcher-functions.sql
          # This is the original Nov17 dispatch/fuel BASELINE, not the newer
          # production dispatcher; never apply the current-source no-op
          # safety migration against an intentionally obsolete test function.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_live_signed_movement_source_20261124.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
      - name: Actual dispatcher rejects inadequate fuel with no writes
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET onboard_kg=100; UPDATE airlinerra_game.section9_game_approved_fuel_load_receipts_v1 SET fuel_after_load_kg=100"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/blocked-dispatch.txt"
          cat "$RUNNER_TEMP/blocked-dispatch.txt"
          grep -q 'AIRCRAFT_FUEL_NOT_PROVEN_AT_ORIGIN' "$RUNNER_TEMP/blocked-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '0:0:open'
      - name: Actual dispatcher records signed movement fuel receipt and closes booking
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET onboard_kg=500; UPDATE airlinerra_game.section9_game_approved_fuel_load_receipts_v1 SET fuel_after_load_kg=500"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/valid-dispatch.txt"
          cat "$RUNNER_TEMP/valid-dispatch.txt"
          grep -q '"departuresRecorded": 1' "$RUNNER_TEMP/valid-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '1:1:closed'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/replay-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed'" | grep -qx 1
      - name: Report test scope
        if: always()
        run: |
          echo '### Actual automatic dispatcher + real signed HMAC movement + real fuel preflight/receipt' >> "$GITHUB_STEP_SUMMARY"
          echo 'Disposable PostgreSQL 17 only. Certified permissions, schedule evidence, maintenance and fuel-auto-supply result are explicit mock input producers.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not verify production credentials, live release, refuel generation, arrival burn, finance or deployment.' >> "$GITHUB_STEP_SUMMARY"
 in fragment, name
            out.append(fragment)
          Path('/tmp/real-dispatcher-functions.sql').write_text('\n'.join(out))
          print('Unmodified production fuel and dispatcher functions extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/real-dispatcher-functions.sql
          # This is the original Nov17 dispatch/fuel BASELINE, not the newer
          # production dispatcher; never apply the current-source no-op
          # safety migration against an intentionally obsolete test function.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_live_signed_movement_source_20261124.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
      - name: Actual dispatcher rejects inadequate fuel with no writes
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET onboard_kg=100; UPDATE airlinerra_game.section9_game_approved_fuel_load_receipts_v1 SET fuel_after_load_kg=100"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/blocked-dispatch.txt"
          cat "$RUNNER_TEMP/blocked-dispatch.txt"
          grep -q 'AIRCRAFT_FUEL_NOT_PROVEN_AT_ORIGIN' "$RUNNER_TEMP/blocked-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '0:0:open'
      - name: Actual dispatcher records signed movement fuel receipt and closes booking
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_game_fuel_custody_v1 SET onboard_kg=500; UPDATE airlinerra_game.section9_game_approved_fuel_load_receipts_v1 SET fuel_after_load_kg=500"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/valid-dispatch.txt"
          cat "$RUNNER_TEMP/valid-dispatch.txt"
          grep -q '"departuresRecorded": 1' "$RUNNER_TEMP/valid-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed')::text||':'||(SELECT count(*) FROM airlinerra_game.section9_game_flight_fuel_departure_receipts_v1 WHERE physical_flight_id='$FID')::text||':'||(SELECT booking_status FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=4)" | grep -qx '1:1:closed'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_dispatch_due_flight_events_v1(10)" > "$RUNNER_TEMP/replay-dispatch.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='$FID' AND phase='departed'" | grep -qx 1
      - name: Report test scope
        if: always()
        run: |
          echo '### Actual automatic dispatcher + real signed HMAC movement + real fuel preflight/receipt' >> "$GITHUB_STEP_SUMMARY"
          echo 'Disposable PostgreSQL 17 only. Certified permissions, schedule evidence, maintenance and fuel-auto-supply result are explicit mock input producers.' >> "$GITHUB_STEP_SUMMARY"
