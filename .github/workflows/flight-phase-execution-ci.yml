name: Airlinerra flight phase execution (isolated)
on:
  push:
    branches: [main]
    paths:
      - 'server/section9-certified-schedule-activation-service.mjs'
      - 'tests/test_section9_certified_schedule_activation_service.mjs'
      - 'supabase/migrations/20261111160000_section9_certified_schedule_activation_commit.sql'
      - 'supabase/migrations/20261111161500_section9_block_uncertified_active_schedule_inserts.sql'
      - 'supabase/migrations/20261111150000_section9_starter_origin_evidence_v1.sql'
      - 'supabase/migrations/20261111152000_section9_starter_initial_position_integration_v1.sql'
      - 'supabase/migrations/20261111154500_section9_due_operational_events_readonly_v1.sql'
      - 'server/section9-flight-phase-timeline.mjs'
      - 'server/section9-clock-job-handler.mjs'
      - 'server/section9-clock-job-edge-entry.ts'
      - 'server/section9-scheduled-game-day-producer.mjs'
      - 'server/section9-verified-game-clock-ingress.mjs'
      - 'server/section9-world-time-edge-entry.ts'
      - 'website/world-time-client.mjs'
      - 'website/player-app.mjs'
      - 'website/private-player-app.html'
      - 'website/dev-scripts/invited-overlay.mjs'
      - 'supabase/migrations/20261111093000_section9_berlin_realtime_clock.sql'
      - 'tests/test_berlin_world_clock.mjs'
      - 'server/section9-aircraft-operations-worker.mjs'
      - 'server/section9-independent-flight-operation-authorizer.mjs'
      - 'server/section9-aircraft-operations-job-handler.mjs'
      - 'server/section9-aircraft-operations-edge-entry.ts'
      - 'server/section9-independent-operation-evidence-reader.mjs'
      - 'supabase/migrations/20261111000500_section9_guarded_world1_clock_cron.sql'
      - 'supabase/migrations/20261111082500_section9_clock_tick_success_receipt_event_id.sql'
      - 'supabase/migrations/20261110235950_section9_flight_engine_readiness_audit_v1.sql'
      - 'supabase/migrations/20261110235955_section9_independent_operated_flight_evidence_v1.sql'
      - 'server/section9-verified-flight-operations-dispatcher.mjs'
      - 'server/section9-verified-flight-fuel-bridge.mjs'
      - 'website/flight-fuel-phase-engine.mjs'
      - 'tests/test_section9_flight_phase_timeline.mjs'
      - 'tests/test_section9_scheduled_game_day_producer.mjs'
      - 'tests/test_section9_verified_game_clock_ingress.mjs'
      - 'tests/test_section9_aircraft_operations_worker.mjs'
      - 'tests/test_section9_verified_flight_operations_dispatcher.mjs'
      - 'tests/test_section9_operated_flight_movement_ingress.mjs'
      - 'tests/test_section9_independent_operation_authorizer.mjs'
      - 'tests/test_section9_private_operations_job_handler.mjs'
      - 'tests/test_section9_independent_operation_evidence_reader.mjs'
      - 'tests/test_section9_fuel_arrival_bridge.mjs'
      - 'tests/test_section9_full_flight_dry_run.mjs'
      - 'tests/test_section9_private_operations_job_handler.mjs'
      - '.github/workflows/flight-phase-execution-ci.yml'
  workflow_dispatch:
jobs:
  flight-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of independent engine contracts
        run: |
          node --check server/section9-certified-schedule-activation-service.mjs
          node --check server/section9-flight-phase-timeline.mjs
          node --check server/section9-clock-job-handler.mjs
          node --check server/section9-scheduled-game-day-producer.mjs
          node --check server/section9-verified-game-clock-ingress.mjs
          node --check website/world-time-client.mjs
          node --check server/section9-aircraft-operations-worker.mjs
          node --check server/section9-independent-flight-operation-authorizer.mjs
          node --check server/section9-aircraft-operations-job-handler.mjs
          node --check server/section9-independent-operation-evidence-reader.mjs
          node --check server/section9-verified-flight-operations-dispatcher.mjs
          node --check server/section9-verified-flight-fuel-bridge.mjs
      - name: Verify five flight phases and trusted movement decisions (no real movements)
        run: |
          node --test tests/test_berlin_world_clock.mjs tests/test_section9_flight_phase_timeline.mjs tests/test_section9_independent_operation_authorizer.mjs tests/test_section9_independent_operation_evidence_reader.mjs tests/test_section9_fuel_arrival_bridge.mjs tests/test_section9_full_flight_dry_run.mjs tests/test_section9_certified_schedule_activation_service.mjs tests/test_section9_private_operations_job_handler.mjs tests/test_section9_scheduled_game_day_producer.mjs tests/test_section9_verified_game_clock_ingress.mjs tests/test_section9_aircraft_operations_worker.mjs tests/test_section9_verified_flight_operations_dispatcher.mjs tests/test_section9_operated_flight_movement_ingress.mjs
      - name: Protected website build
        run: cd website && npm run build
