name: Airlinerra current single-flight creation acceptance (disposable PostgreSQL)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/sql/section9_atomic_single_route_creation.sql'
      - 'server/sql/section9_gated_operational_route_cabin_packages.sql'
      - 'tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql'
      - 'tests/sql/section9_single_flight_real_sql_disposable_bootstrap.sql'
      - 'tests/sql/section9_single_flight_real_sql_disposable_acceptance.sql'
      - 'tests/sql/section9_single_flight_paid_maintenance_bootstrap.sql'
      - 'tests/sql/section9_single_flight_paid_maintenance_acceptance.sql'
      - 'tests/sql/section9_single_flight_passenger_booking_bootstrap.sql'
      - 'supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql'
      - 'supabase/migrations/20261113104046_section9_maintenance_ledger_generated_identity_fix.sql'
      - 'supabase/migrations/20261113104858_section9_unpaid_maintenance_indefinite_grounding.sql'
      - 'supabase/migrations/20261113231000_section9_hourly_game_maintenance_dispatch_clearance_v1.sql'
      - 'supabase/migrations/20261117090000_section9_hourly_maintenance_slot_and_booking_v1.sql'
      - '.github/workflows/section9-single-flight-acceptance-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/sql/section9_atomic_single_route_creation.sql'
      - 'server/sql/section9_gated_operational_route_cabin_packages.sql'
      - 'tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql'
      - 'tests/sql/section9_single_flight_real_sql_disposable_bootstrap.sql'
      - 'tests/sql/section9_single_flight_real_sql_disposable_acceptance.sql'
      - 'tests/sql/section9_single_flight_paid_maintenance_bootstrap.sql'
      - 'tests/sql/section9_single_flight_paid_maintenance_acceptance.sql'
      - 'tests/sql/section9_single_flight_passenger_booking_bootstrap.sql'
      - 'supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql'
      - 'supabase/migrations/20261113104046_section9_maintenance_ledger_generated_identity_fix.sql'
      - 'supabase/migrations/20261113104858_section9_unpaid_maintenance_indefinite_grounding.sql'
      - 'supabase/migrations/20261113231000_section9_hourly_game_maintenance_dispatch_clearance_v1.sql'
      - 'supabase/migrations/20261117090000_section9_hourly_maintenance_slot_and_booking_v1.sql'
      - '.github/workflows/section9-single-flight-acceptance-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-flight-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=30000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Confirm disposable PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'airlinerra_disposable'
          test "$PGUSER" = 'postgres'
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
      - name: Seed controlled synthetic airline aircraft fuel and clock
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_single_flight_real_sql_disposable_bootstrap.sql
      - name: Extract unchanged current route and cabin PostgreSQL functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          route=Path('server/sql/section9_atomic_single_route_creation.sql').read_text()
          cabin=Path('server/sql/section9_gated_operational_route_cabin_packages.sql').read_text()
          def source(src,name):
              start=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
              end=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
              body=src[start:end]
              assert 'SECURITY INVOKER' in body and 'CREATE OR REPLACE FUNCTION' in body
              return body
          functions=[
              source(route,'section9_single_route_first_departure_v1'),
              source(route,'section9_create_active_single_route_v1'),
              source(route,'section9_create_active_route_from_weekly_v1'),
              source(cabin,'section9_resolve_route_onboard_package_v1'),
              source(cabin,'section9_create_active_route_with_cabin_v1'),
          ]
          Path('/tmp/airlinerra-exact-current-single-flight.sql').write_text('\n'.join(functions))
          print('Extracted FIVE unchanged current production route/cabin functions; other authorities remain explicit synthetic fixtures.')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/airlinerra-exact-current-single-flight.sql
      - name: Test single-flight creation, hard failures and full transaction rollback
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_single_flight_real_sql_disposable_acceptance.sql
      - name: Seed controlled overdue aircraft, maintenance tariff and ledger
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_single_flight_paid_maintenance_bootstrap.sql
      - name: Install unchanged production game maintenance booking, paid worker and two independent flight preflights
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          sources={
            'booking': Path('supabase/migrations/20261117090000_section9_hourly_maintenance_slot_and_booking_v1.sql').read_text(),
            'worker': Path('supabase/migrations/20261113104046_section9_maintenance_ledger_generated_identity_fix.sql').read_text(),
            'current': Path('supabase/migrations/20261113104858_section9_unpaid_maintenance_indefinite_grounding.sql').read_text(),
            'dispatch': Path('supabase/migrations/20261113231000_section9_hourly_game_maintenance_dispatch_clearance_v1.sql').read_text()
          }
          def unchanged(source,name):
              offset=source.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
              match=re.search(r'END \$(?:fn|function)\$\s*;',source[offset:],re.DOTALL)
              if match is None: raise ValueError('Missing complete function: '+name)
              body=source[offset:offset+match.end()]
              if not body.strip().endswith(';'): raise ValueError('Truncated SQL function: '+name)
              return body
          exact=[
            unchanged(sources['booking'],'section9_owned_game_maintenance_job_v1'),
            unchanged(sources['worker'],'section9_advance_game_maintenance_jobs_v1'),
            unchanged(sources['current'],'section9_owned_game_maintenance_due_v1'),
            unchanged(sources['current'],'section9_owned_game_maintenance_flight_window_v1'),
            unchanged(sources['dispatch'],'section9_verified_game_maintenance_dispatch_window_v1')
          ]
          Path('/tmp/airlinerra-current-game-maintenance.sql').write_text('\n'.join(exact)+'\n')
          print('Installing five unchanged real maintenance functions (booking, money worker, due, date window, hour-accurate dispatch preflight).')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/airlinerra-current-game-maintenance.sql
      - name: Add disposable physical occurrence capacity and booking inventories
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_single_flight_passenger_booking_bootstrap.sql
      - name: Install unchanged current private game passenger reservation writer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('supabase/migrations/20261113224000_section9_trusted_demand_hold_to_ticket_bridge_v1.sql').read_text()
          name='section9_reserve_verified_game_passenger_seats_v1'
          start=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
          end=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
          body=src[start:end]
          assert 'SECTION9_PASSENGER_RESERVATION_ENGINE_ONLY' in body
          assert 'section9_occurrence_capacity_inventory_v1' in body
          assert 'INSERT INTO airlinerra_game.section9_passenger_reservation_batches_v1' in body
          Path('/tmp/airlinerra-current-passenger-booking.sql').write_text(body)
          print('Current production passenger-reservation function, unchanged. Occurrences, slots and clock are synthetic.')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/airlinerra-current-passenger-booking.sql
      - name: Verify paid maintenance, one active route and real ticket reservations without upfront revenue
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_single_flight_paid_maintenance_acceptance.sql
      - name: Describe the unproven boundaries
        if: always()
        shell: bash
        run: |
          echo '### Current single-flight route creation — disposable PostgreSQL 17' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact server SQL: owner/cabin wrapper, weekly route, first departure and atomic single-flight creation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Maintenance booking, paid worker, due engine, flight window and dispatch preflight are current unmodified SQL. Slot authority, clock, position, certification signers and ticket gateway remain isolated fixtures.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Genuine passenger reservation writer proves seat counting, replay and oversell guards with NO upfront recognition. Signed ticket demand hold, actual departure/arrival, fuel, postflight settlement and refunds are NOT proven. Production untouched.' >> "$GITHUB_STEP_SUMMARY"
