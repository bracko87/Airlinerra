name: Auto fuel starter concurrency with legacy dispatcher (disposable)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_auto_fuel_disposable_dependencies.sql'
      - 'tests/sql/section9_real_dispatcher_disposable_dependencies.sql'
      - 'tests/sql/section9_real_fuel_departure_disposable_dependencies.sql'
      - 'supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'tests/sql/section9_current_live_signed_movement_source_20261124.sql'
      - 'supabase/migrations/20261123210000_section9_dispatch_traffic_permission_binding_fix.sql'
      - '.github/workflows/section9-auto-fuel-starter-concurrency-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-auto-fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Provision disposable flight aircraft fuel and certificate fixtures
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = airlinerra_disposable
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_signed_movement_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_fuel_departure_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_dispatcher_disposable_dependencies.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_auto_fuel_disposable_dependencies.sql
      - name: Install original production preflight supplier receipt and actual dispatcher
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('supabase/migrations/20261117110000_section9_game_fuel_custody_supply_dispatch_v1.sql').read_text()
          names=['section9_verify_game_fuel_before_departure_v1',
                 'section9_auto_supply_game_only_fuel_v1',
                 'section9_capture_verified_departure_fuel_v1',
                 'section9_auto_dispatch_due_flight_events_v1']
          bodies=[]
          for name in names:
            a=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
            b=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',a)
            body=src[a:b]
            if name=='section9_auto_dispatch_due_flight_events_v1':
              # Repair ONLY this OLD Nov17 disposable dispatcher fixture.
              # The live dispatcher has newer AOC/crew/disruption logic.
              for old,new in (
                (' permission_code text;',' required_permission_code text;'),
                ('permission_code:=airlinerra_game.section9_required_game_traffic_permission_v1',
                 'required_permission_code:=airlinerra_game.section9_required_game_traffic_permission_v1'),
                ('IF permission_code IS NULL','IF required_permission_code IS NULL'),
                ('a.permission_code=permission_code','a.permission_code=required_permission_code'),
              ):
                assert old in body, old
                body=body.replace(old,new)
            assert 'END $function$' in body
            bodies.append(body)
          Path('/tmp/actual-auto-fuel-dispatch-functions.sql').write_text('\n'.join(bodies))
          print('Exact production fuel supplier, preflight, departure receipt and dispatcher extracted')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/actual-auto-fuel-dispatch-functions.sql
          # Current delayed-aware signed writer; safely patch only its lock
          # and source-eligible occurrence check. Historical Nov17 dispatcher
          # is a LEGACY BASELINE, not a replica of today's live dispatcher.
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_live_signed_movement_source_20261124.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
      - name: Reject unverified starter location without creating custody
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "DELETE FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1; DELETE FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_owned_aircraft_operational_position_v1(uuid,uuid,uuid,date) RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT '{\"verified\":true,\"atGroundAirport\":true,\"airportKey\":\"TEST-BBB\",\"status\":\"verified_original_game_starter_position\"}'::jsonb \$\$"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_verify_game_fuel_before_departure_v1('$FID')->>'status'" | grep -qx blocked_missing_verified_aircraft_fuel_onboard
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'" | grep -qx blocked_unverified_aircraft_fuel_starter_location
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT count(*) FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1)" | grep -qx '0:0'
      - name: First-ever fuel custody created only at authoritative starter location
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          psql -X -v ON_ERROR_STOP=1 -c "CREATE OR REPLACE FUNCTION airlinerra_game.section9_owned_aircraft_operational_position_v1(uuid,uuid,uuid,date) RETURNS jsonb LANGUAGE sql STABLE AS \$\$ SELECT '{\"verified\":true,\"atGroundAirport\":true,\"airportKey\":\"TEST-AAA\",\"status\":\"verified_original_game_starter_position\"}'::jsonb \$\$"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'" | grep -qx game_only_auto_fuel_supply_recorded
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT count(*) FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1)||':'||(SELECT (onboard_kg=180 AND revision=1 AND at_airport_key='TEST-AAA' AND source_event_kind='approved_game_fuel_load')::int FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT (load_added_kg=180 AND fuel_after_load_kg=180 AND source_status='game_authority_approved')::int FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1)" | grep -qx '1:1:1:1'
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_verify_game_fuel_before_departure_v1('$FID')->>'status'" | grep -qx verified_game_fuel_onboard_available_for_planned_trip
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'" | grep -qx game_fuel_already_sufficient
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1" | grep -qx 1
      - name: Concurrent supplier calls serialize on aircraft and remain exactly once
        shell: bash
        run: |
          set -euo pipefail
          FID='11111111-1111-4111-8111-111111111111:2026-11-23:4'
          # Restore a missing custody and receipt to test creation under contention.
          psql -X -v ON_ERROR_STOP=1 -c "DELETE FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1; DELETE FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1"
          # The first transaction acquires the exact advisory lock the real
          # supplier uses, then invokes the actual production function.
          psql -XAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT pg_advisory_xact_lock(583731,hashtext('33333333-3333-4333-8333-333333333333')); SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'; SELECT pg_sleep(3); COMMIT;" > "$RUNNER_TEMP/first-supplier.txt" 2>&1 &
          first=$!
          occupied=0
          for n in $(seq 1 40); do
            occupied=$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_locks WHERE locktype='advisory' AND granted=true AND pid<>pg_backend_pid() AND classid=583731" || true)
            if [ "${occupied:-0}" -gt 0 ]; then break; fi
            sleep 0.1
          done
          test "${occupied:-0}" -gt 0
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'" | grep -qx game_auto_fuel_aircraft_busy
          wait "$first"
          grep -qx game_only_auto_fuel_supply_recorded "$RUNNER_TEMP/first-supplier.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_auto_supply_game_only_fuel_v1('$FID')->>'status'" | grep -qx game_fuel_already_sufficient
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)||':'||(SELECT count(*) FROM airlinerra_game.section9_game_approved_fuel_load_receipts_v1)||':'||(SELECT revision FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1)" | grep -qx '1:1:1'
      - name: Report test boundary
        if: always()
        run: |
          echo '### Real first-time game fuel supply with synthetic starter position evidence' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verifies missing custody, incorrect airport rejection, source receipt creation, custody revision and parallel supplier lock contention. Actual supplier and preflight are unchanged production SQL.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Starter position function, fuel quote, airport/airline and certification records are labelled synthetic. No production or release changes.' >> "$GITHUB_STEP_SUMMARY"
