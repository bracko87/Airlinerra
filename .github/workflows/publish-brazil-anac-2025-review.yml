name: Publish Brazil ANAC 2025 review evidence

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified ANAC result from successful run 2
        uses: actions/download-artifact@v4
        with:
          name: brazil-anac-2025-official-review
          run-id: 39762869508
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/brazil-review
      - name: Validate source-ID crosswalk and publish review only
        shell: bash
        run: |
          python - <<'PY'
          import csv, os, pathlib, collections
          root = pathlib.Path('.')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'brazil-review/group46_brazil_anac_2025_official_crosswalk.csv'
          assert evidence.is_file(), 'No evidence artifact found'
          with evidence.open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          ids=[r['source_airport_id'] for r in rows]
          assert len(rows)==577 and len(set(ids))==577, 'Incorrect Brazil source ID coverage'
          technical=root/'data/airports/generated/group46/group46_technical_candidates.csv'
          with technical.open(encoding='utf-8-sig',newline='') as f:
              expected={r['ourairports_id'] for r in csv.DictReader(f) if r['iso_country']=='BR'}
          assert len(expected)==577 and set(ids)==expected, 'Technical source IDs differ'
          p=sum(r['passenger_evidence']=='YES' for r in rows)
          c=sum(r['cargo_evidence']=='YES' for r in rows)
          matched=sum(int(r['matched_flight_stage_rows'])>0 for r in rows)
          assert (p,c,matched)==(143,142,151), f'Unexpected evidence counts: {p}, {c}, {matched}'
          assert all(r['passenger_evidence'] in ('YES','UNKNOWN') and r['cargo_evidence'] in ('YES','UNKNOWN') for r in rows)
          target=root/'data/airports/commercial/group46/group46_brazil_anac_2025_official_crosswalk.csv'
          target.write_bytes(evidence.read_bytes())
          report=root/'data/airports/reconciliation/BR_2025_ANAC_OFFICIAL_REVIEW.md'
          report.write_text(
              '# Brazil 2025 official ANAC flight-stage review\n\n'
              'Imported from successful manual GitHub Actions run [#2](https://github.com/bracko87/Airlinerra/actions/runs/39762869508). '
              'The original official source SHA-256 is recorded in its artifact.\n\n'
              '| Metric | Airports |\n|---|---:|\n'
              '| Runway-qualified unique source airports | 577 |\n'
              '| With matching regular/nonregular flight-stage records | 151 |\n'
              '| Positive passenger evidence | 143 |\n'
              '| Positive paid/free freight evidence | 142 |\n'
              '| Both passenger and cargo positive | 137 |\n'
              '| Matching stages but no positive passenger/freight measures | 3 |\n'
              '| No matching stages; evidence UNKNOWN | 426 |\n\n'
              'These are **flight-stage endpoint-associated quantities**, not audited independent airport totals. '
              'No record without positive observations was marked NO. '
              'The raw file includes regular and nonregular activity separately. '
              'No gameplay permissions, airport runway records, final six-level assignments, or deployments were modified.\n'
              'Further alias reconciliation and source interpretation are required before any game permission promotion.\n',
              encoding='utf-8')
          print(f'Published review evidence for {len(rows)} airports; {p} passenger-positive; {c} cargo-positive.')
          PY
      - name: Commit evidence on main, no gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airports/commercial/group46/group46_brazil_anac_2025_official_crosswalk.csv data/airports/reconciliation/BR_2025_ANAC_OFFICIAL_REVIEW.md
          if git diff --cached --quiet; then echo "Already published"; exit 0; fi
          git commit -m "data(airports): archive official ANAC 2025 Brazil evidence crosswalk"
          git push origin HEAD:main
