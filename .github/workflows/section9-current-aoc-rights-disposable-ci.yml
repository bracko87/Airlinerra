name: Canonical AOC and L1/L2 independent source-verifier acceptance (disposable)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/sql/section9_current_live_canonical_aoc_rights_sources_20261124.sql'
      - 'tests/sql/section9_current_aoc_rights_disposable_bootstrap.sql'
      - 'tests/sql/section9_current_aoc_rights_disposable_acceptance.sql'
      - 'tests/sql/section9_beg_zag_live_game_evidence_20261124.sql'
      - 'tests/sql/section9_live_verified_slot_authority_source_20261124.sql'
      - 'tests/sql/section9_real_slot_authority_beg_zag_disposable_bootstrap.sql'
      - 'tests/sql/section9_real_slot_authority_beg_zag_disposable_acceptance.sql'
      - 'server/sql/section9_game_route_restrictions.sql'
      - '.github/workflows/section9-current-aoc-rights-disposable-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_current_live_canonical_aoc_rights_sources_20261124.sql'
      - 'tests/sql/section9_current_aoc_rights_disposable_bootstrap.sql'
      - 'tests/sql/section9_current_aoc_rights_disposable_acceptance.sql'
      - 'tests/sql/section9_beg_zag_live_game_evidence_20261124.sql'
      - 'tests/sql/section9_live_verified_slot_authority_source_20261124.sql'
      - 'tests/sql/section9_real_slot_authority_beg_zag_disposable_bootstrap.sql'
      - 'tests/sql/section9_real_slot_authority_beg_zag_disposable_acceptance.sql'
      - 'server/sql/section9_game_route_restrictions.sql'
      - '.github/workflows/section9-current-aoc-rights-disposable-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-aoc-l1l2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=30000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Guarantee disposable database isolation
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "airlinerra_disposable"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
      - name: Seed synthetic carrier, two draft routes and current World1 canonical AOC licence policy
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_disposable_positive_fra_muc_pair_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_aoc_rights_disposable_bootstrap.sql
      - name: Install SEVEN actual CURRENT deployed canonical AOC, L1/L2 classification and rights-source SQL functions
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_live_canonical_aoc_rights_sources_20261124.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON FUNCTION
          airlinerra_game.section9_verify_game_operator_licence_v1(uuid,uuid,integer,date)
          FROM PUBLIC,anon,authenticated,service_role;
          REVOKE ALL ON FUNCTION
          airlinerra_game.section9_verify_game_route_traffic_rights_v1(uuid,uuid,integer,date)
          FROM PUBLIC,anon,authenticated,service_role;
          SQL
      - name: Verify real BEG-ZAG L1 sources, AOC validity, safety below 70, forged provenance and L2 blocked cabotage
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_current_aoc_rights_disposable_acceptance.sql
      - name: Seed actual read-only BEG-ZAG/MUC A319 weekly restriction evidence and synthetic reservable slot rows
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_beg_zag_live_game_evidence_20261124.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_slot_authority_beg_zag_disposable_bootstrap.sql
      - name: Install unchanged real game restriction guard and exact deployed slot source-verification function
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('server/sql/section9_game_route_restrictions.sql').read_text()
          name='section9_game_route_restrictions_valid_v1'
          start=src.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
          end=src.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
          body=src[start:end]
          assert 'SECURITY INVOKER' in body and 'simpleNightNoise' in body
          Path('/tmp/actual-game-route-restriction.sql').write_text(body)
          print('Loaded exact current Section9 enforceable game airport restriction guard')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/actual-game-route-restriction.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_live_verified_slot_authority_source_20261124.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          REVOKE ALL ON FUNCTION
          airlinerra_game.section9_verify_slot_clearance_source_v1(uuid,uuid,integer,date)
          FROM PUBLIC,anon,authenticated,service_role;
          SQL
      - name: Verify actual independent slot source BEG-ZAG and every capacity / noise / reservation denial guard
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_slot_authority_beg_zag_disposable_acceptance.sql
      - name: Describe certification boundary
        if: always()
        run: |
          echo '### Source-backed AOC and L1/L2 acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unmodified read-only snapshots of seven deployed database functions; synthetic current original-company AOC/tick/safety/country/rights source fixtures, all inside local ephemeral PostgreSQL 17.' >> "$GITHUB_STEP_SUMMARY"
          echo 'AOC 365-day provenance, 70-point safety rule, Licence1 BEG-ZAG and strict Licence2 FRA-MUC cross-border policy verified without old disabled business-permission tables.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CURRENT deployed game slot authority independently verifies live BEG-ZAG game-restriction receipts and synthetic current stand reservations. It rejects MUC unverified A319 Chapter, missing/overbooked slots, too-short runway, hard curfew, stale tick and version mismatch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does NOT issue Vault HMAC certification events, reserve LIVE airport slots, book live aircraft maintenance, create routes or change player money. No production data writes or paid staging.' >> "$GITHUB_STEP_SUMMARY"
