name: Airlinerra homepage development notice and closed registration
on:
  push:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/script.js'
      - 'website/studio-footer.js'
      - 'website/studio-footer.css'
      - 'tests/test_financial_charts_and_studio_footer.mjs'
      - 'website/styles.css'
      - 'website/register.html'
      - 'website/real-registration.mjs'
      - 'website/registration-access.mjs'
      - 'tests/test_homepage_account_entries.mjs'
      - 'tests/test_registration_access.mjs'
      - '.github/workflows/homepage-prelaunch-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/script.js'
      - 'website/studio-footer.js'
      - 'website/studio-footer.css'
      - 'tests/test_financial_charts_and_studio_footer.mjs'
      - 'website/styles.css'
      - 'website/register.html'
      - 'website/real-registration.mjs'
      - 'website/registration-access.mjs'
      - 'tests/test_homepage_account_entries.mjs'
      - 'tests/test_registration_access.mjs'
      - '.github/workflows/homepage-prelaunch-ci.yml'
  workflow_dispatch:
jobs:
  homepage-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Pexels 3716220 video delivery (read-only diagnostic)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url='https://www.pexels.com/download/video/3716220/';
          let next=url;
          for(let i=0;i<5;i++){
            try {
              const response=await fetch(next,{redirect:'manual',signal:AbortSignal.timeout(12000),headers:{Range:'bytes=0-1023','User-Agent':'Mozilla/5.0'}});
              const location=response.headers.get('location');
              const parsed=new URL(next);
              console.log(JSON.stringify({step:i,status:response.status,domain:parsed.hostname,path:parsed.pathname,
                type:response.headers.get('content-type'),length:response.headers.get('content-length'),
                next:location?new URL(location,next).hostname:null}));
              await response.body?.cancel();
              if(!location||![301,302,303,307,308].includes(response.status))break;
              next=new URL(location,next).toString();
            }catch(e){console.log('Pexels check:',e.message);break;}
          }
          JS
      - name: Verify marketing scene JavaScript syntax
        run: node --check website/script.js
      - name: Verify public registration stays closed and existing sign-in remains linked
        run: node --test tests/test_homepage_account_entries.mjs tests/test_registration_access.mjs
      - name: Verify shared footer excludes duplicate current-time line
        run: node --test tests/test_financial_charts_and_studio_footer.mjs
      - name: Build protected Airlinerra website
        run: cd website && npm run build
      - name: Validate complete player bundle imports
        run: node --test tests/test_player_built_module_graph.mjs
