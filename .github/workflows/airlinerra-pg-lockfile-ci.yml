name: Airlinerra pinned PostgreSQL dependency validation (non-deploying)

# Source-only reproducible dependency and static-site checks. No real
# Supabase connection, Netlify deployment, release secrets, or write token.
on:
  push:
    branches: [main]
    paths:
      - website/package.json
      - website/package-lock.json
      - tests/test_pg_driver_contract.mjs
      - .github/workflows/airlinerra-pg-lockfile-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pg-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install exactly locked dependencies
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate installed pg and enforced TLS using real driver
        working-directory: website
        run: node --test ../tests/test_pg_driver_contract.mjs
      - name: Preserve isolated public website without deployment
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f ../dist/index.html
          test ! -d netlify/functions
          test ! -d ../netlify/functions
          test ! -e ../dist/server
          test ! -e ../dist/node_modules
          test ! -e ../dist/package.json
          grep -Eq '^export const PUBLIC_AUTH_ENABLED = false;' auth-rules.mjs
