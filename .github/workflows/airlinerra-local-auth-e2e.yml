name: Airlinerra local Supabase Auth and Mailpit E2E

# Never deploys. Launches fresh local Docker services inside the GitHub runner.
# Only this workflow and the isolated E2E script trigger the heavy job.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/airlinerra-local-auth-e2e.yml'
      - 'tests/e2e/local-supabase-auth.mjs'
      - 'tests/e2e/local-player-onboarding.mjs'
      - 'tests/e2e/package.json'
      - 'tests/e2e/browser-account-ui.mjs'
      - 'tests/e2e/browser-sdk-entry.mjs'
      - 'website/account.js'
      - 'website/account.html'
      - 'website/auth-client.mjs'
      - 'website/dev-scripts/dev-local-auth.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airlinerra-local-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-local-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Zero cloud credentials, no hosted Supabase URL, synthetic users only.
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Check local-only service settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'project_id = "airlinerra-local-auth"' supabase/config.toml
          grep -Fq 'enable_confirmations = true' supabase/config.toml
          ! grep -Fq 'hwllkabgzaynalahvkpz' supabase/config.toml
          supabase --version
          docker info >/dev/null
      - name: Start disposable local Supabase Auth, PostgreSQL and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Run real signup, confirmation, login and recovery through Mailpit
        shell: bash
        run: |
          set -euo pipefail
          node tests/e2e/local-supabase-auth.mjs
      - name: Verify local PostgreSQL and apply REVIEW-ONLY schema to disposable stack
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          pg_isready -h 127.0.0.1 -p 54322 -U postgres -d postgres
          [ "$(psql -Atqc "select current_database()")" = 'postgres' ]
          [ "$(psql -Atqc "select count(*) from pg_namespace where nspname = 'airlinerra'")" = '0' ]
          [ "$(psql -Atqc "select (to_regclass('auth.users') is not null)::integer")" = '1' ]
          psql -v ON_ERROR_STOP=1 -f docs/sql/airlinerra_game_identity_schema_prelaunch.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql/airlinerra_game_activation_prelaunch.sql
          echo 'Game schema exists only inside disposable local CI PostgreSQL.'
      - name: Install exact isolated test dependencies
        working-directory: tests/e2e
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify actual Auth to profile, legal consent and airline activation
        shell: bash
        run: |
          set -euo pipefail
          node tests/e2e/local-player-onboarding.mjs
      - name: Bundle isolated public browser Auth SDK
        shell: bash
        run: |
          set -euo pipefail
          ./tests/e2e/node_modules/.bin/esbuild tests/e2e/browser-sdk-entry.mjs \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=website/.airlinerra-local-sdk.mjs
          test -s website/.airlinerra-local-sdk.mjs
      - name: Select Chromium for real browser E2E
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$BROWSER" ]; then
            echo "AIRLINERRA_CHROME_PATH=$BROWSER" >> "$GITHUB_ENV"
            "$BROWSER" --version
            echo 'Using GitHub runner Chrome without downloading a second browser.'
          else
            ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Verify real browser signup, email confirmation, profile and recovery
        shell: bash
        run: |
          set -euo pipefail
          node tests/e2e/browser-account-ui.mjs
      - name: Stop the isolated local Supabase stack
        if: always()
        shell: bash
        run: supabase stop || true
