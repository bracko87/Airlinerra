name: Real signed movement and cancellation race (disposable)
on:
  push:
    branches: [main]
    paths:
      - 'tests/sql/section9_real_cancellation_disposable_bootstrap.sql'
      - 'tests/sql/section9_real_signed_movement_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - 'server/sql/section9_disruption_decision_and_cancellation.sql'
      - '.github/workflows/section9-real-signed-cancel-race-ci.yml'
  pull_request:
    paths:
      - 'tests/sql/section9_real_cancellation_disposable_bootstrap.sql'
      - 'tests/sql/section9_real_signed_movement_disposable_dependencies.sql'
      - 'supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql'
      - '.github/workflows/section9-real-signed-cancel-race-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-signed-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: airlinerra_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d airlinerra_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-only
      PGDATABASE: airlinerra_disposable
      PGOPTIONS: -c statement_timeout=20000 -c lock_timeout=10000
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y postgresql-client; fi
      - name: Verify disposable database and install synthetic dependencies
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = airlinerra_disposable
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/disposable_database_preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_cancellation_disposable_bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/section9_real_signed_movement_disposable_dependencies.sql
      - name: Install unchanged real cancellation and guarded real signed writer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('server/sql/section9_disruption_decision_and_cancellation.sql').read_text()
          name='section9_cancel_unflown_occurrence_v1'
          start=source.index('CREATE OR REPLACE FUNCTION airlinerra_game.'+name+'(')
          end=source.index('REVOKE ALL ON FUNCTION airlinerra_game.'+name+'(',start)
          Path('/tmp/airlinerra-real-cancellation.sql').write_text(source[start:end])
          guarded=Path('supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql').read_text()
          assert 'SECTION9_SIGNED_DEPARTURE_OCCURRENCE_NOT_OPEN' in guarded
          assert 'pg_advisory_xact_lock(583729,10041)' in guarded
          print('Unmodified real cancellation function and guarded real signed movement writer ready')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/airlinerra-real-cancellation.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261123200000_section9_signed_movement_cancellation_guard.sql
      - name: Cancellation first rejects real correctly HMAC-signed departure
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000001','maximum_delay_exceeded')->>'status'" | grep -qx flight_cancelled
          if psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_record_signed_operated_flight_movement_v1('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1,'2026-11-23',1,'departed','2026-11-23 18:00+00','TEST-SIGNED-EVENT-01',airlinerra_game.test_sign_event('TEST-SIGNED-EVENT-01','2026-11-23 18:00+00',1))" > /tmp/invalid-real-signed.txt 2>&1; then
            echo 'CRITICAL: cancelled flight accepted a genuine HMAC movement'; exit 1
          fi
          grep -q SECTION9_SIGNED_DEPARTURE_OCCURRENCE_NOT_OPEN /tmp/invalid-real-signed.txt
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT booking_status||':'||(SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='11111111-1111-4111-8111-111111111111:2026-11-23:1') FROM airlinerra_game.section9_dated_flight_occurrences_v1 WHERE weekly_entry=1" | grep -qx 'cancelled:0'
      - name: Genuine HMAC departure first prevents real cancellation
        run: |
          set -euo pipefail
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_record_signed_operated_flight_movement_v1('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1,'2026-11-23',2,'departed','2026-11-23 18:00+00','TEST-SIGNED-EVENT-02',airlinerra_game.test_sign_event('TEST-SIGNED-EVENT-02','2026-11-23 18:00+00',2))->>'status'" | grep -qx operated_flight_departure_recorded
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000002','maximum_delay_exceeded')->>'status'" | grep -qx flight_already_operated_or_settled
          psql -XAt -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_dated_flight_occurrences_v1 SET booking_status='closed' WHERE weekly_entry=2 AND booking_status='open' RETURNING booking_status" | grep -qx closed
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id='11111111-1111-4111-8111-111111111111:2026-11-23:2'" | grep -qx 1
          # Synthetic multi-flight fixture repositions aircraft after prior verification.
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE airlinerra_game.section9_aircraft_current_position_v1 SET location_status='grounded',airport_key='TEST-AAA',current_flight_occurrence_id=NULL,last_event_utc=NULL,last_departure_utc=NULL"
      - name: Held fuel custody + genuine signed writer wins against real cancellation
        shell: bash
        run: |
          set -euo pipefail
          psql -XqAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT onboard_kg FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1 FOR UPDATE; SELECT pg_sleep(3); COMMIT;" > "$RUNNER_TEMP/fuel-holder.txt" 2>&1 &
          holder=$!
          sleep 0.25
          psql -XqAt -v ON_ERROR_STOP=1 -c "BEGIN; SELECT pg_advisory_xact_lock(583729,10041); SELECT onboard_kg FROM airlinerra_game.section9_aircraft_game_fuel_custody_v1 FOR UPDATE; SELECT airlinerra_game.section9_record_signed_operated_flight_movement_v1('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111',1,'2026-11-23',3,'departed','2026-11-23 18:00+00','TEST-SIGNED-EVENT-03',airlinerra_game.test_sign_event('TEST-SIGNED-EVENT-03','2026-11-23 18:00+00',3))->>'status'; UPDATE airlinerra_game.section9_dated_flight_occurrences_v1 SET booking_status='closed' WHERE weekly_entry=3 AND booking_status='open'; COMMIT;" > "$RUNNER_TEMP/real-departure.txt" 2>&1 &
          dispatcher=$!
          seen=0
          for n in $(seq 1 30); do
            blocked=$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_stat_activity WHERE wait_event_type='Lock' AND query LIKE 'BEGIN; SELECT pg_advisory_xact_lock(583729,10041)%';")
            if [ "$blocked" -gt 0 ]; then seen=1; break; fi
            sleep 0.1
          done
          test "$seen" -eq 1
          psql -XqAt -v ON_ERROR_STOP=1 -c "SELECT airlinerra_game.section9_cancel_unflown_occurrence_v1('00000000-0000-4000-8000-000000000003','maximum_delay_exceeded')->>'status'" > "$RUNNER_TEMP/real-cancel-after.txt" 2>&1 &
          canceller=$!
          wait "$holder"; wait "$dispatcher"; wait "$canceller"
          grep -qx operated_flight_departure_recorded "$RUNNER_TEMP/real-departure.txt"
          grep -qx flight_not_cancellable "$RUNNER_TEMP/real-cancel-after.txt"
          psql -XAt -v ON_ERROR_STOP=1 -c "SELECT o.booking_status||':'||(SELECT count(*) FROM airlinerra_game.section9_operated_flight_movements_v1 WHERE flight_occurrence_id=o.schedule_id::text||':'||o.flight_local_date::text||':'||o.weekly_entry::text)||':'||(SELECT count(*) FROM airlinerra_game.section9_flight_cancellation_receipts_v1 WHERE occurrence_id=o.id) FROM airlinerra_game.section9_dated_flight_occurrences_v1 o WHERE weekly_entry=3" | grep -qx 'closed:1:0'
      - name: Report boundaries
        if: always()
        run: |
          echo '### Real HMAC movement writer + real cancellation, disposable PostgreSQL' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both production SQL functions run; the signed writer has a forward-only corrective SQL guard. Genuine pgcrypto HMAC, synthetic secret and clock/aircraft/booking dependencies.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The full production fuel preflight and receipt functions are NOT run; custody lock is directly acquired in the orchestration fixture. No production release or deployment.' >> "$GITHUB_STEP_SUMMARY"
