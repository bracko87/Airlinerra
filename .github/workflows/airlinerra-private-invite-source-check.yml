name: Airlinerra private invitation source checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/invited-tester-entry.mjs'
      - 'website/invited-tester-page.mjs'
      - 'website/invited-tester-page.css'
      - 'website/prelaunch-invited-account.html'
      - 'website/invited-tester-auth.mjs'
      - 'website/dev-scripts/build.mjs'
      - 'website/package.json'
      - 'tests/test_invited_tester_entry.mjs'
      - 'tests/test_invited_tester_auth.mjs'
      - '.github/workflows/airlinerra-private-invite-source-check.yml'

permissions:
  contents: read

jobs:
  private-invite-source:
    name: Private invitation flow stays isolated
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check website/invited-tester-entry.mjs
          node --check website/invited-tester-page.mjs
      - name: Test invited-only callbacks, OTP scrubbing and provider gates
        run: |
          node --test tests/test_invited_tester_entry.mjs tests/test_invited_tester_auth.mjs tests/test_hosted_auth_readiness.mjs tests/test_prelaunch_release_invariants.mjs
      - name: Build current unchanged public prelaunch site
        working-directory: website
        run: npm run build
      - name: Assert invited-only modules and HTML were NOT published
        run: |
          test -f dist/account.html
          test ! -e dist/prelaunch-invited-account.html
          test ! -e dist/invited-tester-entry.mjs
          test ! -e dist/invited-tester-page.mjs
          test ! -e dist/invited-tester-auth.mjs
          grep -q 'export const PUBLIC_AUTH_ENABLED = false;' dist/auth-rules.mjs
