name: Airlinerra invitation-only main build checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/invited-tester-entry.mjs'
      - 'website/tester-dashboard.mjs'
      - 'website/player-app.mjs'
      - 'website/local-onboarding-draft.mjs'
      - 'tests/test_local_onboarding_draft.mjs'
      - 'tests/test_prelaunch_release_audit.mjs'
      - 'tests/test_local_preview_http.mjs'
      - 'website/dev-scripts/local-preview-catalog.mjs'
      - 'website/local-catalog-client.mjs'
      - 'website/dev-data/**'
      - 'tests/test_local_preview_catalog.mjs'
      - 'website/player-read-client.mjs'
      - 'website/dev-scripts/real-player-read-gateway.mjs'
      - 'tests/test_real_local_player_gateway.mjs'
      - 'server/player-read-service.mjs'
      - 'tests/test_player_read_api.mjs tests/test_real_local_player_gateway.mjs'
      - 'website/index.html'
      - 'website/styles.css'
      - 'website/register.html'
      - 'website/register.css'
      - 'tests/test_homepage_account_entries.mjs'
      - 'website/player-app-model.mjs'
      - 'website/player-app.css'
      - 'website/private-player-app.html'
      - 'tests/test_player_app_prelaunch.mjs'
      - 'website/tester-dashboard-state.mjs'
      - 'website/tester-dashboard.css'
      - 'website/private-tester-dashboard.html'
      - 'tests/test_invited_tester_dashboard.mjs'
      - 'website/invited-tester-page.mjs'
      - 'website/real-registration.mjs'
      - 'website/register.html'
      - 'website/real-onboarding-client.mjs'
      - 'website/dev-scripts/real-player-read-gateway.mjs'
      - 'website/dev-only/**'
      - 'website/register-local-entry.mjs'
      - 'tests/test_local_registration_flow.mjs'
      - 'website/local-demo-session.mjs'
      - 'tests/test_local_demo_flow.mjs'
      - 'website/invited-tester-page.css'
      - 'website/prelaunch-invited-account.html'
      - 'website/invited-tester-auth.mjs'
      - 'website/invited-tester-public-settings.mjs'
      - 'website/dev-scripts/build-invited-tester.mjs'
      - 'website/dev-scripts/invited-overlay.mjs'
      - 'website/dev-scripts/dev.mjs'
      - 'tests/test_invited_tester_manual_bundle.mjs'
      - '.github/workflows/airlinerra-manual-invited-tester-site.yml'
      - 'website/dev-scripts/build.mjs'
      - 'website/package.json'
      - 'tests/test_invited_tester_entry.mjs'
      - 'tests/test_invited_tester_auth.mjs'
      - '.github/workflows/airlinerra-private-invite-source-check.yml'

permissions:
  contents: read

jobs:
  private-invite-source:
    name: Private invitation flow stays isolated
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check syntax
        run: |
          node --check website/invited-tester-entry.mjs
          node --check website/invited-tester-page.mjs
          node --check website/real-registration.mjs
          node --check website/real-onboarding-client.mjs
          node --check website/dev-scripts/real-player-read-gateway.mjs
          node --check website/local-demo-session.mjs
          node --check website/dev-only/registration.mjs
          node --check website/dev-only/state.mjs
          node --check website/tester-dashboard.mjs
          node --check website/tester-dashboard-state.mjs
          node --check website/player-app.mjs
          node --check website/local-onboarding-draft.mjs
          node --check website/dev-scripts/local-preview-catalog.mjs
          node --check website/local-catalog-client.mjs
          node --check website/player-read-client.mjs
          node --check website/dev-scripts/real-player-read-gateway.mjs
          node --check server/player-read-service.mjs
          node --check website/player-app-model.mjs
      - name: Test invited-only callbacks, OTP scrubbing and provider gates
        run: |
          node --test tests/test_homepage_account_entries.mjs tests/test_invited_tester_entry.mjs tests/test_invited_tester_auth.mjs tests/test_invited_tester_dashboard.mjs tests/test_player_app_prelaunch.mjs tests/test_player_read_api.mjs tests/test_local_demo_flow.mjs tests/test_local_preview_catalog.mjs tests/test_local_onboarding_draft.mjs tests/test_local_registration_flow.mjs tests/test_prelaunch_release_audit.mjs tests/test_hosted_auth_readiness.mjs tests/test_prelaunch_release_invariants.mjs
      - name: Build ordinary main website with invitation-only account
        working-directory: website
        run: npm run build
      - name: Verify regular main build and safe localhost visual preview
        run: node --test tests/test_invited_tester_manual_bundle.mjs
      - name: Smoke-test built localhost pages and actual read-only airport HTTP endpoints
        run: node tests/test_local_preview_http.mjs
      - name: Assert invited-only account is included without public signup
        run: |
          test -f dist/account.html
          test -f dist/register.html
          grep -q '/account.html?screen=sign-in' dist/index.html
          grep -q '/register.html' dist/index.html
          test -f dist/tester.html
          test -f dist/player.html
          test -f dist/player-app.mjs
          test -f dist/player-app-model.mjs
          test -f dist/tester-dashboard.mjs
          test -f dist/tester-dashboard-state.mjs
          grep -q 'id="tester-dashboard" hidden' dist/tester.html
          grep -q 'PRIVATE PRELAUNCH ACCESS' dist/account.html
          test -f dist/invited-tester-entry.mjs
          test -f dist/invited-tester-page.mjs
          test -f dist/invited-tester-auth.mjs
          test -f dist/invited-tester-config.js
          ! grep -q 'id="register"' dist/account.html
          grep -q 'export const PUBLIC_AUTH_ENABLED = false;' dist/auth-rules.mjs
