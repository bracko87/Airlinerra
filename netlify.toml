# Isolated public prelaunch site. Never publish the airport research data/ directory.
[build]
  base = "website"
  command = "npm run build"
  publish = "../dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/health"
  to = "/health.html"
  status = 200
